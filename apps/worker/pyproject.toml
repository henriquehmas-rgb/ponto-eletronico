####################################################################
# ponto-worker - processamento assincrono (ARQ + Redis)
#
# Dois processos saem deste mesmo pacote, como declarado em
# `infra/docker-compose.yml`:
#
#   worker     arq worker.main.WorkerSettings
#   scheduler  arq worker.scheduler.SchedulerSettings
#
# Fase 0 entrega ANDAIME: as oito tarefas do sistema estao registradas
# com nome, fila e assinatura definitivos, e devolvem um resultado
# marcado como nao implementado. Nenhum calculo acontece aqui ainda.
####################################################################

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ponto-worker"
version = "0.1.0"
description = "Workers ARQ do Ponto Eletronico: apuracao, arquivos fiscais, relatorios e webhooks"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "SEEG Servicos de Tecnologia da Informacao" }]
classifiers = [
    "Private :: Do Not Upload",
    "Programming Language :: Python :: 3.12",
    "Natural Language :: Portuguese (Brazilian)",
]

dependencies = [
    "arq>=0.26",
    "redis>=5.0",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.30,<3.0",
    "asyncpg>=0.29",
    # --- F2 ---
    # `importar_colaboradores` (worker/tarefas/importacoes.py) le planilhas
    # XLSX de ate 5.000 linhas. `ponto-contracts` (models SQLAlchemy do
    # contrato) ja e instalado por camada separada no Dockerfile
    # (`COPY packages/contracts /contratos`); nao repetido aqui.
    "openpyxl>=3.1",
    # --- fim F2 ---
    # --- F11 ---
    # `worker/scheduler.py::verificar_agendamentos_relatorio` (T11/A3) calcula
    # `proxima_execucao_em` a partir da expressao cron de
    # `relatorio_agendamentos.cron` (por exemplo "0 8 1 * *"). `croniter` e a
    # biblioteca padrao de mercado para isto em Python, pura (sem dependencia
    # de sistema), e nenhuma alternativa ja esta no projeto.
    "croniter>=2.0",
    # O canal `webhook` de `relatorio_agendamentos` (`app.relatorios.entrega.
    # webhook`, T11/A3) faz um POST HTTP simples de entrega -- nao a
    # assinatura HMAC/retentativa/DLQ completa da tag `webhooks` (F13, fora
    # de escopo). `apps/api` ja depende de `httpx` desde o andaime da Fase 0;
    # so o worker ainda nao tinha consumidor. Mesma versao minima da API,
    # para nao divergir.
    "httpx>=0.27",
    # --- fim F11 ---
]

[project.optional-dependencies]
dev = [
    "ruff==0.7.4",
    "mypy==1.13.0",
    "pytest==9.0.3",
    "pytest-asyncio==0.24.0",
    "pytest-cov==6.0.0",
    # `arq --watch /app` (command do override de desenvolvimento) importa
    # watchfiles em tempo de execucao e falha com ImportError sem ela.
    "watchfiles>=0.24",
    # --- F2 --- (stub de tipos para o mypy --strict de `importar_colaboradores`)
    "types-openpyxl>=3.1",
    # --- fim F2 ---
    # --- F11 --- (stub de tipos para o mypy --strict de `worker.scheduler`/
    # `app.relatorios.agendamentos`, que chamam `croniter`)
    "types-croniter>=2.0",
    # --- fim F11 ---
]

# Descoberta automatica, nao lista estatica: uma lista manual fica
# desatualizada no instante em que alguem adiciona um subpacote e esquece de
# atualizar aqui — achado num deploy real em outro servico da casa (api),
# onde subpacotes inteiros sumiram do build sem erro nenhum.
[tool.setuptools.packages.find]
include = ["worker*"]

[tool.setuptools]
include-package-data = true
zip-safe = false

[tool.setuptools.package-data]
worker = ["py.typed"]

# ==================================================================
# ruff
# ==================================================================
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "C4", "SIM", "TID", "RUF", "ASYNC", "S"]
ignore = ["B008", "RUF002", "RUF003", "N818"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["worker"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

# ==================================================================
# mypy
# ==================================================================
[tool.mypy]
python_version = "3.12"
files = ["worker"]
strict = true
warn_unused_configs = true
warn_unreachable = true
show_error_codes = true
pretty = true

[[tool.mypy.overrides]]
module = ["arq.*", "redis.*"]
ignore_missing_imports = true

# F11/A3: `worker/tarefas/relatorios.py::_EscritorPdf` usa `reportlab`
# diretamente (mesmo pacote que `apps/api` já trata assim, `apps/api/
# pyproject.toml`, bloco F10) -- disponível no venv do worker porque
# `apps/api` é instalado como biblioteca (ADR-009), mas sem stubs/py.typed
# próprios, mesmo tratamento que `apps/api` já dá.
[[tool.mypy.overrides]]
module = ["reportlab.*"]
ignore_missing_imports = true

# ==================================================================
# pytest
# ==================================================================
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q --strict-markers --strict-config"
