; ============================================================================
; Alembic - Ponto Eletronico (REP-P multiempresa)
;
; A URL do banco NAO fica neste arquivo. Ela e resolvida em tempo de execucao
; por `migrations/env.py`, que le, nesta ordem:
;   1. -x url=...            (ex.: alembic -x url=postgresql+psycopg://... upgrade head)
;   2. DATABASE_URL_SYNC     (driver sincrono, o que o Alembic usa)
;   3. DATABASE_URL          (converte +asyncpg para +psycopg automaticamente)
;
; Regra da casa: segredo nenhum entra no repositorio. Ver infra/.env.example.
;
; Uso a partir de apps/api:
;   alembic upgrade head
;   alembic downgrade base
;   alembic revision --autogenerate -m "descricao"
;   alembic upgrade head --sql        # gera o SQL sem tocar em banco algum
; ============================================================================

[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os

; Nome dos arquivos de versao: <numero>_<slug>.py, ex.: 0002_indices_apuracao.py
file_template = %%(rev)s_%%(slug)s

; Fuso usado no cabecalho das revisoes geradas.
timezone = America/Sao_Paulo

; sqlalchemy.url e deixado VAZIO de proposito: env.py resolve.
sqlalchemy.url =


; ----------------------------------------------------------------------------
; Logging
; ----------------------------------------------------------------------------
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
