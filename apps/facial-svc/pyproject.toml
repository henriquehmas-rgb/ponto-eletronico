####################################################################
# ponto-facial-svc - motor facial self-hosted (wrapper HTTP)
#
# Decisao D4 de PROJETO.md: reaproveitar `analise-facial-edge`
# (InsightFace / ArcFace ONNX). Sem custo por chamada e, sobretudo,
# sem biometria saindo da infraestrutura da SEEG (LGPD art. 5, II).
#
# O pacote se chama `facial`, e nao `app`, porque `apps/api` ja e dono
# do nome de modulo `app` e o CI roda `mypy apps packages` a partir da
# raiz do monorepo — dois pacotes de mesmo nome fazem o mypy abortar a
# coleta inteira. O `command` do override de desenvolvimento continua
# sendo `uvicorn app.main:app`: o Dockerfile instala um alias na imagem.
# Ver `facial/__init__.py`.
#
# NOTA SOBRE AS DEPENDENCIAS: `onnxruntime`, `insightface`, `numpy` e
# `opencv` NAO estao declarados. Fase 0 nao carrega modelo nenhum, e
# declarar biblioteca pesada antes de existir codigo que a use so faz a
# imagem crescer e o build do CI demorar. Elas entram na F2, junto com
# o codigo que as chama.
####################################################################

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ponto-facial-svc"
version = "0.1.0"
description = "Servico facial self-hosted do Ponto Eletronico: enrollment, verificacao e prova de vida"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "SEEG Servicos de Tecnologia da Informacao" }]
classifiers = [
    "Private :: Do Not Upload",
    "Programming Language :: Python :: 3.12",
    "Natural Language :: Portuguese (Brazilian)",
]

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.6",
]

[project.optional-dependencies]
dev = [
    "ruff==0.7.4",
    "mypy==1.13.0",
    "pytest==8.3.4",
    "pytest-asyncio==0.24.0",
    "pytest-cov==6.0.0",
    # Cliente HTTP do TestClient do FastAPI.
    "httpx>=0.27",
    # `errors.yaml` e lido pelo teste que confere o recorte do catalogo.
    "pyyaml>=6.0",
    "types-PyYAML>=6.0",
]

[tool.setuptools]
packages = ["facial", "facial.rotas"]
include-package-data = true
zip-safe = false

[tool.setuptools.package-data]
facial = ["py.typed"]

# ==================================================================
# ruff
# ==================================================================
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["."]
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "C4", "SIM", "TID", "RUF", "ASYNC", "S"]
ignore = [
    # FastAPI usa chamada de funcao em valor padrao (Depends, Query, Path, Body).
    "B008",
    # Docstrings do dominio sao escritas em portugues, com acento.
    "RUF002",
    "RUF003",
    # N818 exige sufixo "Error" no nome da excecao. O dominio e escrito em
    # portugues do Brasil (regra da casa): `ErroDeAplicacao`.
    "N818",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["facial"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

# ==================================================================
# mypy
# ==================================================================
[tool.mypy]
python_version = "3.12"
files = ["facial"]
strict = true
warn_unused_configs = true
warn_unreachable = true
show_error_codes = true
pretty = true

# ==================================================================
# pytest
# ==================================================================
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q --strict-markers --strict-config"

[tool.coverage.run]
source = ["facial"]
omit = ["*/tests/*"]
