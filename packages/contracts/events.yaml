    descricao: >-
      O motor detectou uma inconsistencia e abriu ocorrencia. Ocorrencia nao corrige nada: ela
      chama o humano e alimenta a fila de trabalho do gestor.
    quando_dispara: Durante a apuracao do dia, ao identificar desvio ou inconsistencia.
    webhook_publico: false
    escopo_requerido: tratamentos:ler
    origem: worker
    motivo_interno: >-
      Volume alto e util sobretudo para a interface e as notificacoes. Integradores devem
      consumir o relatorio de ocorrencias, que ja vem agregado.
    payload:
      type: object
      required: [ocorrenciaId, colaboradorId, data, codigo, severidade]
      properties:
        ocorrenciaId: {type: string, format: uuid, description: Ocorrencia aberta.}
        colaboradorId: {type: string, format: uuid, description: Colaborador afetado.}
        vinculoId: {type: string, format: uuid, description: Vinculo afetado.}
        apuracaoDiaId: {type: string, format: uuid, description: Apuracao que originou a ocorrencia.}
        data: {type: string, format: date, description: Dia da ocorrencia.}
        codigo: {type: string, description: "Codigo fechado da ocorrencia, por exemplo marcacaoImpar."}
        severidade:
          type: string
          enum: [info, atencao, alta, critica]
          description: Gravidade atribuida pelo motor.
        descricao: {type: string, description: Texto explicativo da ocorrencia.}
    exemplo:
      ocorrenciaId: c5a90f23-1b47-4e6d-82a5-9d3f0c7b6e18
      colaboradorId: f27c1a90-6e5b-4d38-9a02-8c4b71e3d605
      vinculoId: 7e14a2c6-5d09-4b83-93f1-6a0c8e2d7b54
      apuracaoDiaId: 8f3d0b71-4a2e-4c95-b06d-51e7a9c2f483
      data: "2026-07-22"
      codigo: marcacao_impar
      severidade: alta
      descricao: Dia com numero impar de marcacoes; falta o par de saida.

  - nome: comprovante.emitido
    versao: 1
    descricao: >-
      O comprovante de registro foi emitido e esta disponivel eletronicamente. E o que dispensa
      a impressao no momento da marcacao, desde que as ultimas 48 horas fiquem acessiveis.
    quando_dispara: Na mesma transacao da marcacao, imediatamente apos a atribuicao do NSR.
    webhook_publico: false
    escopo_requerido: marcacoes:ler
    origem: api
    motivo_interno: >-
      Redundante com marcacao.criada, que ja traz comprovanteId. Existe para a interface e para
      a fila de notificacao push, nao para integracao externa.
    payload:
      type: object
      required: [comprovanteId, marcacaoId, colaboradorId, numero, nsr, emitidoEm, hashSha256]
      properties:
        comprovanteId: {type: string, format: uuid, description: Comprovante emitido.}
        marcacaoId: {type: string, format: uuid, description: Marcacao correspondente.}
        colaboradorId: {type: string, format: uuid, description: Colaborador do registro.}
        numero: {type: string, description: "Numero do comprovante, unico no tenant."}
        nsr: {type: integer, format: int64, description: NSR da marcacao.}
        emitidoEm: {type: string, format: date-time, description: Instante da emissao.}
        hashSha256: {type: string, pattern: "^[0-9a-f]{64}$", description: Hash do conteudo do comprovante.}
        canalEntrega:
          type: string
          enum: [app, web, email, impresso, api, terminal]
          description: Canal por onde o comprovante foi disponibilizado.
    exemplo:
      comprovanteId: 8f3d0b71-4a2e-4c95-b06d-51e7a9c2f483
      marcacaoId: 4a8e35d1-2c60-4f7b-8e93-0b1d6c5a24f7
      colaboradorId: f27c1a90-6e5b-4d38-9a02-8c4b71e3d605
      numero: "2026072500001842"
      nsr: 1842
      emitidoEm: "2026-07-25T08:02:13-03:00"
      hashSha256: "7b0d3f1a5c9e2846170ac3e2f0d1b68594c7ae201f9b3d6580c2e4a1f6d0937b"
      canalEntrega: terminal

  - nome: importacao.concluida
    versao: 1
    descricao: >-
      Uma importacao terminou. O relatorio linha a linha fica disponivel para download e e o
      que torna a carga de milhares de registros auditavel.
    quando_dispara: Ao final do processamento, com sucesso total ou parcial.
    webhook_publico: true
    escopo_requerido: integracoes:ler
    origem: worker
    payload:
      type: object
      required: [importacaoId, tipo, status, totalLinhas, linhasSucesso, linhasErro]
      properties:
        importacaoId: {type: string, format: uuid, description: Importacao processada.}
        empresaId: {type: string, format: uuid, description: Empresa alvo da carga.}
        tipo:
          type: string
          enum: [colaboradores, estrutura, escalas, feriados, marcacoes, afdTerceiro, bancoHoras, biometria, afastamentos]
          description: Tipo de importacao executada.
        status:
          type: string
          enum: [concluido, concluidoComErros, falhou]
          description: Desfecho do processamento.
        totalLinhas: {type: integer, format: int32, description: Linhas lidas do arquivo.}
        linhasSucesso: {type: integer, format: int32, description: Linhas processadas com sucesso.}
        linhasErro: {type: integer, format: int32, description: Linhas recusadas.}
        relatorioDisponivel: {type: boolean, description: Indica se ha relatorio de erros para download.}
    exemplo:
      importacaoId: 1e5b93c0-7d24-4a11-9b6e-3c8f0a2d5471
      empresaId: b3f61d47-0a5c-4d92-a7e8-14c6b09f2358
      tipo: colaboradores
      status: concluidoComErros
      totalLinhas: 5000
      linhasSucesso: 4987
      linhasErro: 13
      relatorioDisponivel: true

  - nome: webhook.desabilitado
    versao: 1
    descricao: >-
      Um webhook foi desabilitado automaticamente por falhas consecutivas. Nao e entregue no
      proprio webhook desabilitado: aparece no painel de entregas e nas notificacoes do tenant.
    quando_dispara: Quando falhasConsecutivas ultrapassa o limite configurado no webhook.
    webhook_publico: false
    escopo_requerido: webhooks:ler
    origem: worker
    motivo_interno: Entregar a um endpoint morto o aviso de que ele esta morto nao funcionaria.
    payload:
      type: object
      required: [webhookId, nome, falhasConsecutivas, desabilitadoEm]
      properties:
        webhookId: {type: string, format: uuid, description: Webhook desabilitado.}
        nome: {type: string, description: Nome do webhook no cadastro.}
        url: {type: string, format: uri, description: Destino configurado.}
        falhasConsecutivas: {type: integer, format: int32, description: Falhas consecutivas acumuladas.}
        ultimoErro: {type: string, description: Ultimo erro observado na entrega.}
        entregasNaDlq: {type: integer, format: int32, description: Entregas aguardando reenvio manual.}
        desabilitadoEm: {type: string, format: date-time, description: Instante da desabilitacao automatica.}
    exemplo:
      webhookId: 9c7a2f18-4b3d-4e6a-8f21-5d0c7b1a9e42
      nome: folha-dominio
      url: https://erp.cliente.com.br/hooks/ponto
      falhasConsecutivas: 8
      ultimoErro: "HTTP 502 apos 10s"
      entregasNaDlq: 34
      desabilitadoEm: "2026-07-25T04:15:00-03:00"
