# =============================================================================
# Ponto Eletronico (REP-P multiempresa) - CATALOGO DE EVENTOS E WEBHOOKS
# Arquivo: packages/contracts/events.yaml
# Fase 0 - Fundacao e Contratos - Agente A1b
#
# Este arquivo e a FONTE DA VERDADE dos eventos de dominio. O worker publica
# usando estes nomes, a tabela `webhooks.eventos` so aceita valores daqui, a
# coluna `notificacoes.evento` referencia estes codigos e a trilha de auditoria
# grava o mesmo nome em `auditoria.evento`. Falta um evento? Abra RFC.
#
# Convencoes:
#   1. Nome no formato `<agregado>.<fato no participio>`, sempre em passado:
#      o evento descreve algo que JA aconteceu e nao pode ser recusado.
#   2. `versao` e inteiro. Mudanca compativel (campo novo opcional) NAO troca a
#      versao; mudanca incompativel publica `<nome>` na versao seguinte e mantem
#      a anterior por, no minimo, um ciclo de depreciacao de 180 dias.
#   3. `webhook_publico: false` significa evento interno: dispara notificacao e
#      trabalho de worker, mas nao e assinavel por cliente de integracao.
#   4. O payload NUNCA carrega dado pessoal sensivel. Nada de template
#      biometrico, foto, CID de atestado ou coordenada exata. O consumidor que
#      precisar do detalhe busca na API com o proprio token e fica registrado
#      em `acessos_dados_sensiveis`.
#   5. Entrega ao menos uma vez (at-least-once). O consumidor DEVE deduplicar
#      por `id` do envelope e tolerar reordenacao.
# =============================================================================

versao: "1.0.0"
atualizado_em: "2026-07-25"

# -----------------------------------------------------------------------------
# Envelope de entrega (identico para todos os eventos)
# -----------------------------------------------------------------------------
envelope:
  descricao: >-
    Corpo HTTP de toda entrega de webhook. O evento especifico vai no campo `dados`,
    conforme o `payload` declarado para aquele nome de evento.
  media_type: application/json
  schema:
    type: object
    required: [id, tipo, versao, ocorridoEm, tenantId, dados]
    properties:
      id:
        type: string
        format: uuid
        description: >-
          Identificador unico do evento de dominio. Estavel entre retentativas da mesma
          entrega. E a chave de deduplicacao do consumidor.
      tipo:
        type: string
        description: Nome do evento no catalogo, por exemplo marcacao.criada.
      versao:
        type: integer
        format: int32
        description: Versao do contrato do payload deste evento.
      ocorridoEm:
        type: string
        format: date-time
        description: Instante em que o fato ocorreu, no relogio do servidor.
      publicadoEm:
        type: string
        format: date-time
        description: Instante em que o evento foi enfileirado para entrega.
      tenantId:
        type: string
        format: uuid
        description: Tenant dono do dado. Sempre conferir contra o tenant esperado pelo consumidor.
      empresaId:
        type: string
        format: uuid
        description: Empresa (CNPJ) a que o fato pertence, quando aplicavel.
      ambiente:
        type: string
        enum: [sandbox, producao]
        description: Ambiente que originou o evento. Evento de sandbox nunca alcanca endpoint de producao.
      tentativa:
        type: integer
        format: int32
        description: Numero da tentativa de entrega, comecando em 1.
      dados:
        type: object
        additionalProperties: true
        description: Payload especifico do evento, conforme o catalogo abaixo.
  exemplo:
    id: 9c7a2f18-4b3d-4e6a-8f21-5d0c7b1a9e42
    tipo: marcacao.criada
    versao: 1
    ocorridoEm: "2026-07-25T08:02:13-03:00"
    publicadoEm: "2026-07-25T08:02:13-03:00"
    tenantId: 1e5b93c0-7d24-4a11-9b6e-3c8f0a2d5471
    empresaId: b3f61d47-0a5c-4d92-a7e8-14c6b09f2358
    ambiente: producao
    tentativa: 1
    dados: {}

# -----------------------------------------------------------------------------
# Assinatura HMAC
# -----------------------------------------------------------------------------
assinatura:
  cabecalho: X-Ponto-Signature
  algoritmo: HMAC-SHA256
  formato: "t=<epoch_segundos>,v1=<hex_minusculo>"
  base_assinada: "<epoch_segundos>.<corpo bruto exatamente como recebido>"
  tolerancia_segundos: 300
  observacoes: >-
    Compare em tempo constante. Assine o corpo BRUTO, antes de qualquer parse ou
    reserializacao, porque reserializar altera a ordem das chaves e quebra a verificacao.
    Rejeite entregas com carimbo fora da tolerancia: e a defesa contra replay.
  cabecalhos_adicionais:
    X-Ponto-Event: Nome do evento, igual a `tipo` do envelope.
    X-Ponto-Event-Id: Identificador do evento, igual a `id` do envelope. Use para deduplicar.
    X-Ponto-Delivery-Id: Identificador da tentativa de entrega. Muda a cada retentativa.
    X-Ponto-Tenant: Slug do tenant de origem.

# -----------------------------------------------------------------------------
# Politica de entrega
# -----------------------------------------------------------------------------
entrega:
  garantia: at-least-once
  ordem_garantida: false
  timeout_padrao_segundos: 10
  sucesso: Qualquer status 2xx. O corpo da resposta e ignorado.
  max_tentativas_padrao: 8
  backoff: "exponencial com jitter: 10s, 30s, 2min, 10min, 30min, 2h, 6h, 12h"
  dead_letter: >-
    Esgotadas as tentativas, a entrega vai para a DLQ e pode ser reenviada manualmente em
    POST /v1/webhooks/{webhookId}/entregas/{entregaId}/reenviar.
  desabilitacao_automatica: >-
    Falhas consecutivas acima do limite do webhook mudam o status para desabilitadoPorFalha
    e passam a responder PONTO-WEBH-002 no cadastro.
  recomendacao_consumidor: >-
    Responda 2xx assim que persistir o evento e processe de forma assincrona. Processar
    de forma sincrona antes de responder aumenta o timeout e provoca reentrega desnecessaria.

# =============================================================================
# Eventos
# =============================================================================
eventos:

  # ---------------------------------------------------------------------------
  # Marcacao
  # ---------------------------------------------------------------------------
  - nome: marcacao.criada
    versao: 1
    descricao: >-
      Uma marcacao de ponto foi gravada com NSR atribuido e comprovante emitido. E o evento
      mais volumoso do sistema: dimensione o consumidor para o pico de entrada e saida.
    quando_dispara: >-
      Imediatamente apos o commit da transacao que grava a marcacao, em qualquer canal
      (terminal, mobile, web, totem ou api). Nunca dispara para item de fila offline
      recusado nem para tratamento.
    webhook_publico: true
    escopo_requerido: marcacoes:ler
    origem: api
    payload:
      type: object
      required: [marcacaoId, colaboradorId, cpf, nsr, datahoraMarcacao, canal, repPId]
      properties:
        marcacaoId: {type: string, format: uuid, description: Identificador da marcacao.}
        colaboradorId: {type: string, format: uuid, description: Colaborador identificado no registro.}
        vinculoId: {type: string, format: uuid, description: Vinculo ao qual a marcacao sera apurada.}
        cpf: {type: string, pattern: "^[0-9]{11}$", description: "CPF congelado no registro, como vai para o AFD."}
        matricula: {type: string, description: Matricula interna do colaborador na empresa.}
        nsr: {type: integer, format: int64, description: Numero Sequencial de Registro atribuido pelo servidor.}
        repPId: {type: string, format: uuid, description: REP-P dono da sequencia de NSR.}
        unidadeId: {type: string, format: uuid, description: Unidade de origem do registro.}
        datahoraMarcacao: {type: string, format: date-time, description: "Momento do fato, no relogio do servidor."}
        datahoraGravacao: {type: string, format: date-time, description: Momento em que o servidor persistiu o registro.}
        canal:
          type: string
          enum: [terminal, mobile, web, totem, api, importacao]
          description: Canal de origem da marcacao.
        coletadaOffline: {type: boolean, description: Verdadeiro quando o registro chegou por fila offline.}
        comprovanteId: {type: string, format: uuid, description: Comprovante emitido para esta marcacao.}
        hashRegistro: {type: string, pattern: "^[0-9a-f]{64}$", description: "SHA-256 do registro, elo da cadeia de hash."}
    exemplo:
      marcacaoId: 4a8e35d1-2c60-4f7b-8e93-0b1d6c5a24f7
      colaboradorId: f27c1a90-6e5b-4d38-9a02-8c4b71e3d605
      vinculoId: 3b9d47e2-8c15-4a60-bf7c-2e0a9d61c483
      cpf: "12345678909"
      matricula: "001234"
      nsr: 1842
      repPId: 7e14a2c6-5d09-4b83-93f1-6a0c8e2d7b54
      unidadeId: c5a90f23-1b47-4e6d-82a5-9d3f0c7b6e18
      datahoraMarcacao: "2026-07-25T08:02:13-03:00"
      datahoraGravacao: "2026-07-25T08:02:13-03:00"
      canal: terminal
      coletadaOffline: false
      comprovanteId: 8f3d0b71-4a2e-4c95-b06d-51e7a9c2f483
      hashRegistro: "3f5a1c9e2b7d40681a4c8e0f2d6b9137548ac0e2f1b3d7695a8c0e4f2d1b6937"

  - nome: marcacao.suspeita
    versao: 1
    descricao: >-
      Marcacao gravada com score de confianca entre o limiar de bloqueio e o de revisao. O
      registro EXISTE e vale legalmente; o que fica pendente e a revisao humana do risco.
    quando_dispara: >-
      Junto com marcacao.criada, quando a classificacao de confianca resulta em media e o
      registro entra na fila de revisao do gestor.
    webhook_publico: true
    escopo_requerido: marcacoes:ler
    origem: api
    observacao_lgpd: >-
      O payload traz apenas os nomes dos sinais acionados, nunca a coordenada exata, a foto
      nem o identificador do aparelho.
    payload:
      type: object
      required: [marcacaoId, colaboradorId, scoreConfianca, classificacao, sinais]
      properties:
        marcacaoId: {type: string, format: uuid, description: Marcacao sinalizada.}
        colaboradorId: {type: string, format: uuid, description: Colaborador do registro.}
        nsr: {type: integer, format: int64, description: NSR da marcacao sinalizada.}
        canal:
          type: string
          enum: [terminal, mobile, web, totem, api, importacao]
          description: Canal de origem.
        scoreConfianca: {type: integer, format: int32, description: Score composto de 0 a 100 calculado no servidor.}
        classificacao:
          type: string
          enum: [alta, media, baixa, bloqueada]
          description: Faixa resultante da comparacao com os limiares da politica de registro.
        sinais:
          type: array
          items: {type: string}
          description: >-
            Sinais que puxaram o score para baixo, por exemplo foraGeocerca, modoDesenvolvedor,
            attestationReprovado, mockLocation, velocidadeImpossivel.
        revisaoStatus:
          type: string
          enum: [naoRequer, pendente, aprovada, rejeitada]
          description: Estado da fila de revisao no momento do evento.
    exemplo:
      marcacaoId: 4a8e35d1-2c60-4f7b-8e93-0b1d6c5a24f7
      colaboradorId: f27c1a90-6e5b-4d38-9a02-8c4b71e3d605
      nsr: 1842
      canal: mobile
      scoreConfianca: 58
      classificacao: media
      sinais: [foraGeocerca, modoDesenvolvedor]
      revisaoStatus: pendente

  - nome: marcacao.sincronizada_offline
    versao: 1
    descricao: >-
      Item capturado sem rede foi validado (HMAC e contador monotonico) e convertido em
      marcacao. A marcacao permanece sinalizada como coletada offline no espelho: o sistema
      nunca finge que o registro foi online.
    quando_dispara: >-
      Quando a fila offline e processada com sucesso. Itens fora do TTL nao geram este evento:
      viram ocorrencia (PONTO-MARC-005).
    webhook_publico: true
    escopo_requerido: marcacoes:ler
    origem: worker
    payload:
      type: object
      required: [marcacaoId, filaOfflineId, colaboradorId, datahoraMarcacao, atrasoMinutos]
      properties:
        marcacaoId: {type: string, format: uuid, description: Marcacao criada a partir do item.}
        filaOfflineId: {type: string, format: uuid, description: Item da fila offline consumido.}
        colaboradorId: {type: string, format: uuid, description: Colaborador do registro.}
        dispositivoId: {type: string, format: uuid, description: Aparelho que originou a captura.}
        datahoraMarcacao: {type: string, format: date-time, description: Momento do fato preservado do instante da captura.}
        datahoraDispositivo: {type: string, format: date-time, description: "Relogio do aparelho no momento da captura, guardado como evidencia."}
        recebidoEm: {type: string, format: date-time, description: Momento em que o item chegou ao servidor.}
        atrasoMinutos: {type: integer, format: int32, description: Minutos entre a captura e a sincronizacao.}
        confiancaTemporal:
          type: string
          enum: [alta, media, baixa]
          description: Classificacao da confianca do horario, derivada do relogio monotonico do aparelho.
    exemplo:
      marcacaoId: 4a8e35d1-2c60-4f7b-8e93-0b1d6c5a24f7
      filaOfflineId: 8f3d0b71-4a2e-4c95-b06d-51e7a9c2f483
      colaboradorId: f27c1a90-6e5b-4d38-9a02-8c4b71e3d605
      dispositivoId: c5a90f23-1b47-4e6d-82a5-9d3f0c7b6e18
      datahoraMarcacao: "2026-07-24T17:58:41-03:00"
      datahoraDispositivo: "2026-07-24T17:58:39-03:00"
      recebidoEm: "2026-07-25T07:12:05-03:00"
      atrasoMinutos: 794
      confiancaTemporal: alta

  # ---------------------------------------------------------------------------
  # Ajuste de ponto (solicitacao + tratamento)
  # ---------------------------------------------------------------------------
  - nome: ajuste.solicitado
    versao: 1
    descricao: >-
      Um pedido de ajuste de ponto foi aberto e entrou na cadeia de aprovacao. Ajuste NUNCA
      altera marcacao: aprovado, ele vira tratamento e se soma a marcacao na apuracao.
    quando_dispara: Na criacao de uma solicitacao cujo tipo pertence a categoria ajustePonto.
    webhook_publico: true
    escopo_requerido: solicitacoes:ler
    origem: api
    payload:
      type: object
      required: [solicitacaoId, protocolo, colaboradorId, dataReferencia, tipoSolicitacaoCodigo]
      properties:
        solicitacaoId: {type: string, format: uuid, description: Solicitacao criada.}
        protocolo: {type: string, description: Numero de protocolo legivel informado ao colaborador.}
        colaboradorId: {type: string, format: uuid, description: Colaborador alvo do ajuste.}
        vinculoId: {type: string, format: uuid, description: Vinculo alvo do ajuste.}
        solicitanteUsuarioId: {type: string, format: uuid, description: Usuario que abriu o pedido.}
        tipoSolicitacaoCodigo: {type: string, description: Codigo do tipo de solicitacao.}
        dataReferencia: {type: string, format: date, description: Dia da jornada a ser corrigido.}
        descricao: {type: string, description: Justificativa informada pelo solicitante.}
        possuiAnexo: {type: boolean, description: Indica se ha documento anexado (o conteudo nao trafega no evento).}
        prazoEm: {type: string, format: date-time, description: Prazo de resposta da etapa corrente.}
        etapaAtual: {type: integer, format: int32, description: Indice da etapa em andamento na cadeia de aprovacao.}
    exemplo:
      solicitacaoId: 3b9d47e2-8c15-4a60-bf7c-2e0a9d61c483
      protocolo: "2026-000184"
      colaboradorId: f27c1a90-6e5b-4d38-9a02-8c4b71e3d605
      vinculoId: 7e14a2c6-5d09-4b83-93f1-6a0c8e2d7b54
      solicitanteUsuarioId: 1e5b93c0-7d24-4a11-9b6e-3c8f0a2d5471
      tipoSolicitacaoCodigo: ajuste_ponto
      dataReferencia: "2026-07-22"
      descricao: Esqueci de registrar a saida do intervalo.
      possuiAnexo: false
      prazoEm: "2026-07-27T18:00:00-03:00"
      etapaAtual: 1

  - nome: ajuste.aprovado
    versao: 1
    descricao: >-
      O pedido de ajuste percorreu a cadeia e foi aprovado. O tratamento correspondente foi
      criado e o dia entrou na fila de recalculo.
    quando_dispara: Na aprovacao da ultima etapa da cadeia definida no tipo de solicitacao.
    webhook_publico: true
    escopo_requerido: solicitacoes:ler
    origem: api
    payload:
      type: object
      required: [solicitacaoId, protocolo, colaboradorId, dataReferencia, tratamentoId, decididoEm]
      properties:
        solicitacaoId: {type: string, format: uuid, description: Solicitacao aprovada.}
        protocolo: {type: string, description: Numero de protocolo.}
        colaboradorId: {type: string, format: uuid, description: Colaborador alvo.}
        vinculoId: {type: string, format: uuid, description: Vinculo alvo.}
        dataReferencia: {type: string, format: date, description: Dia corrigido.}
        tratamentoId: {type: string, format: uuid, description: Tratamento gerado pela aprovacao.}
        aprovadorUsuarioId: {type: string, format: uuid, description: Usuario que decidiu.}
        porDelegacao: {type: boolean, description: Verdadeiro quando a decisao foi exercida por delegacao.}
        decididoEm: {type: string, format: date-time, description: Instante da decisao final.}
        comentario: {type: string, description: Comentario do aprovador.}
    exemplo:
      solicitacaoId: 3b9d47e2-8c15-4a60-bf7c-2e0a9d61c483
      protocolo: "2026-000184"
      colaboradorId: f27c1a90-6e5b-4d38-9a02-8c4b71e3d605
      vinculoId: 7e14a2c6-5d09-4b83-93f1-6a0c8e2d7b54
      dataReferencia: "2026-07-22"
      tratamentoId: b3f61d47-0a5c-4d92-a7e8-14c6b09f2358
      aprovadorUsuarioId: 9c7a2f18-4b3d-4e6a-8f21-5d0c7b1a9e42
      porDelegacao: false
      decididoEm: "2026-07-23T10:41:02-03:00"
      comentario: Conferido com o registro do portao.

  - nome: ajuste.reprovado
    versao: 1
    descricao: O pedido de ajuste foi reprovado. Nenhum tratamento e criado e a apuracao do dia nao muda.
    quando_dispara: Quando qualquer etapa da cadeia decide por reprovar.
    webhook_publico: true
    escopo_requerido: solicitacoes:ler
    origem: api
    payload:
      type: object
      required: [solicitacaoId, protocolo, colaboradorId, dataReferencia, decididoEm, motivo]
      properties:
        solicitacaoId: {type: string, format: uuid, description: Solicitacao reprovada.}
        protocolo: {type: string, description: Numero de protocolo.}
        colaboradorId: {type: string, format: uuid, description: Colaborador alvo.}
        dataReferencia: {type: string, format: date, description: Dia que permanece sem correcao.}
        etapa: {type: integer, format: int32, description: Etapa em que a reprovacao ocorreu.}
        aprovadorUsuarioId: {type: string, format: uuid, description: Usuario que decidiu.}
        decididoEm: {type: string, format: date-time, description: Instante da decisao.}
        motivo: {type: string, description: "Justificativa da reprovacao, exibida ao colaborador."}
    exemplo:
      solicitacaoId: 3b9d47e2-8c15-4a60-bf7c-2e0a9d61c483
      protocolo: "2026-000184"
      colaboradorId: f27c1a90-6e5b-4d38-9a02-8c4b71e3d605
      dataReferencia: "2026-07-22"
      etapa: 1
      aprovadorUsuarioId: 9c7a2f18-4b3d-4e6a-8f21-5d0c7b1a9e42
      decididoEm: "2026-07-23T10:44:57-03:00"
      motivo: Horario informado nao confere com o controle de acesso da unidade.

  # ---------------------------------------------------------------------------
  # Apuracao e fechamento
  # ---------------------------------------------------------------------------
  - nome: apuracao.recalculada
    versao: 1
    descricao: >-
      O motor reprocessou um intervalo e o resultado mudou. Recalculo sem mudanca efetiva NAO
      dispara evento: o hash dos insumos e comparado antes.
    quando_dispara: Ao final do processamento assincrono de recalculo, por vinculo e intervalo.
    webhook_publico: true
    escopo_requerido: tratamentos:ler
    origem: worker
    payload:
      type: object
      required: [vinculoId, colaboradorId, dataInicio, dataFim, diasAlterados, motivo]
      properties:
        recalculoId: {type: string, format: uuid, description: Processamento que originou o recalculo.}
        vinculoId: {type: string, format: uuid, description: Vinculo reprocessado.}
        colaboradorId: {type: string, format: uuid, description: Colaborador do vinculo.}
        dataInicio: {type: string, format: date, description: Primeiro dia do intervalo reprocessado.}
        dataFim: {type: string, format: date, description: Ultimo dia do intervalo reprocessado.}
        diasAlterados: {type: integer, format: int32, description: Quantidade de dias cujo resultado mudou.}
        motivo:
          type: string
          enum: [tratamento, afastamento, jornada, escala, feriado, marcacaoTardia, politicaBanco, manual]
          description: Insumo que provocou o reprocessamento.
        saldoAnteriorMinutos: {type: integer, format: int32, description: Soma do saldo do intervalo antes do recalculo.}
        saldoNovoMinutos: {type: integer, format: int32, description: Soma do saldo do intervalo depois do recalculo.}
    exemplo:
      recalculoId: c5a90f23-1b47-4e6d-82a5-9d3f0c7b6e18
      vinculoId: 7e14a2c6-5d09-4b83-93f1-6a0c8e2d7b54
      colaboradorId: f27c1a90-6e5b-4d38-9a02-8c4b71e3d605
      dataInicio: "2026-07-22"
      dataFim: "2026-07-22"
      diasAlterados: 1
      motivo: tratamento
      saldoAnteriorMinutos: -62
      saldoNovoMinutos: 0

  - nome: periodo.fechado
    versao: 1
    descricao: >-
      Um periodo foi fechado para um escopo. A partir daqui, tratamento e recalculo nos dias
      cobertos respondem PONTO-PER-001 ate a reabertura autorizada.
    quando_dispara: Na conclusao do fechamento, depois de gerados os espelhos do escopo.
    webhook_publico: true
    escopo_requerido: fechamentos:ler
    origem: api
    payload:
      type: object
      required: [fechamentoId, periodoId, empresaId, escopo, dataInicio, dataFim, fechadoEm]
      properties:
        fechamentoId: {type: string, format: uuid, description: Fechamento concluido.}
        periodoId: {type: string, format: uuid, description: Periodo de apuracao travado.}
        empresaId: {type: string, format: uuid, description: Empresa do fechamento.}
        escopo:
          type: string
          enum: [empresa, unidade, departamento, equipe, colaborador]
