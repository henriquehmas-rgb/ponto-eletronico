####################################################################
# ponto-contracts - contrato de dados do Ponto Eletronico (REP-P)
#
# Pacote Python instalavel com os models SQLAlchemy 2 que traduzem
# `packages/contracts/schema.sql`, a fonte da verdade do modelo.
#
# O diretorio de codigo chama-se `models/` (caminho fixado pelo
# ownership da Fase 0) e e publicado sob o nome importavel
# `ponto_contracts` via `tool.setuptools.package-dir`. Isso evita que
# um pacote de topo generico chamado `models` colida com qualquer
# outra dependencia instalada no mesmo ambiente.
#
# Instalacao em desenvolvimento, a partir da raiz do monorepo:
#     pip install -e packages/contracts
#
# Uso:
#     from ponto_contracts import Base, Marcacao, Vinculo
####################################################################

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ponto-contracts"
version = "0.1.0"
description = "Contrato de dados do Ponto Eletronico REP-P: models SQLAlchemy 2 espelhando schema.sql"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [
    { name = "SEEG Servicos de Tecnologia da Informacao" },
]
keywords = ["ponto-eletronico", "rep-p", "portaria-671", "sqlalchemy", "contrato"]
classifiers = [
    "Private :: Do Not Upload",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Natural Language :: Portuguese (Brazilian)",
]

dependencies = [
    "sqlalchemy>=2.0.30",
    "pydantic>=2.7",
    "psycopg[binary]>=3.1",
]

[project.optional-dependencies]
# Ferramental necessario para gerar e aplicar migrations a partir destes models.
dev = [
    "alembic>=1.13",
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.urls]
Repositorio = "https://github.com/henriquehmas-rgb/ponto-eletronico"
Contrato = "https://github.com/henriquehmas-rgb/ponto-eletronico/tree/main/packages/contracts"

# ------------------------------------------------------------------
# Mapeamento de diretorio -> pacote importavel
# ------------------------------------------------------------------
[tool.setuptools]
packages = ["ponto_contracts"]
include-package-data = true
zip-safe = false

[tool.setuptools.package-dir]
ponto_contracts = "models"

[tool.setuptools.package-data]
ponto_contracts = ["py.typed"]

# ------------------------------------------------------------------
# ruff
#
# Precisa existir AQUI. O ruff procura a configuracao no pyproject.toml
# mais proximo do arquivo analisado; encontrando este sem `[tool.ruff]`,
# ele nao herda a configuracao de `apps/api/pyproject.toml` -- cai no
# padrao (line-length 88). Os models sao escritos a 100 colunas, como
# manda a casa, logo `ruff format --check apps packages tests` (etapa do
# CI) reprovaria 16 arquivos por divergencia de configuracao, nao por
# defeito de codigo. Os valores abaixo sao os mesmos de apps/api.
# ------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
