# =============================================================================
# Ponto Eletronico — stack de PRODUCAO (prd)
# =============================================================================
# ESTE ARQUIVO E EXCLUSIVO DE PRODUCAO. Homologacao usa infra/docker-compose.yml.
#
# Por que dois arquivos, e nao um so parametrizado por variavel:
#   ate 2026-08 o MESMO docker-compose.yml servia hml e prd, diferenciado apenas
#   por .env. Nada tecnicamente impedia subir producao com config de teste (ou o
#   contrario) por um `--env-file` errado. Separar em dois arquivos torna o erro
#   estrutural, nao apenas humano: o que e obrigatorio em prd esta ESCRITO aqui.
#
# Diferencas deliberadas em relacao a infra/docker-compose.yml (hml):
#   1. AMBIENTE fixo em `prd` — nao vem de variavel; nao da para rodar este
#      arquivo "como hml" por engano.
#   2. Volumes e rede interna com nomes LITERAIS `ponto-prd-*`, sem depender de
#      COMPOSE_PROJECT_NAME. Dois stacks na mesma VPS nunca compartilham dado
#      por colisao de nome de volume.
#   3. `restart: always` (hml usa unless-stopped): apos reboot da VPS, producao
#      volta sozinha mesmo que alguem tenha dado `stop` manual antes.
#   4. Console do MinIO DESLIGADO de verdade: MINIO_BROWSER=off literal, porta
#      9001 nao exposta, nenhum bloco de labels do Traefik nem comentado.
#      Acesso administrativo ao MinIO em prd e por tunel SSH + `mc`, so isso.
#   5. Sem secao `build:` em nenhum servico. Producao NUNCA constroi imagem na
#      VPS: consome apenas o que o CI publicou no registry. `docker compose
#      build` neste arquivo falha, e isso e o comportamento desejado.
#   6. TAG obrigatoria e sem default `latest`: producao roda tag imutavel
#      (SHA curto do commit), para o rollback ser "aponte a tag anterior".
#   7. Toda variavel que em hml tinha default silencioso e OBRIGATORIA aqui
#      (`:?`) quando um default errado teria consequencia real.
#
# Uso (sempre via infra/deploy-prod.sh, que exige confirmacao explicita):
#   docker compose -p ponto-prd --env-file .env.prod -f docker-compose.prod.yml config
#   docker compose -p ponto-prd --env-file .env.prod -f docker-compose.prod.yml up -d
#
# Premissas herdadas de PROJETO.md §11.2 (valem igual em prd):
#   * O Traefik JA EXISTE na VPS e e quem escuta 80/443. Este arquivo NUNCA
#     publica essas portas nem sobe outro proxy.
#   * Nenhum segredo e literal: tudo vem de variavel de ambiente. Copie
#     infra/.env.prod.example para infra/.env.prod e preencha.
#   * Todo servico tem healthcheck; as dependencias usam service_healthy.
#
# NAO existe combinacao deste arquivo com docker-compose.dev.yml. Aquele
# override publica portas no host e e so para desenvolvimento local.
# =============================================================================

# -----------------------------------------------------------------------------
# Blocos reutilizaveis
# -----------------------------------------------------------------------------
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "10"

# always (nao unless-stopped): producao volta sozinha apos reboot da VPS.
x-restart: &restart
  restart: always

# Variaveis comuns a todos os servicos Python (api, worker, scheduler, device-gw)
x-python-env: &python-env
  AMBIENTE: prd
  TZ: ${TZ:-America/Sao_Paulo}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  # ponto_app_runtime (NUNCA POSTGRES_USER): a imagem oficial do Postgres sempre
  # cria POSTGRES_USER como SUPERUSER, e RLS nunca se aplica a superusuario
  # (ADR-001) -- a aplicacao precisa da role de LOGIN de privilegio minimo que
  # a migration 0004_role_login_app cria, nunca da credencial administrativa.
  DATABASE_URL: postgresql+asyncpg://ponto_app_runtime:${POSTGRES_APP_PASSWORD:?defina POSTGRES_APP_PASSWORD}@postgres:5432/${POSTGRES_DB:?defina POSTGRES_DB}
  REDIS_URL: redis://:${REDIS_PASSWORD:?defina REDIS_PASSWORD}@redis:6379/${REDIS_DB:-0}
  MINIO_ENDPOINT: minio:9000
  MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?defina MINIO_ROOT_USER}
  MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?defina MINIO_ROOT_PASSWORD}
  MINIO_BUCKET: ${MINIO_BUCKET:-ponto}
  MINIO_SECURE: ${MINIO_SECURE:-false}
  JWT_PRIVATE_KEY_PATH: ${JWT_PRIVATE_KEY_PATH:-/run/secrets/jwt/private.pem}
  JWT_PUBLIC_KEY_PATH: ${JWT_PUBLIC_KEY_PATH:-/run/secrets/jwt/public.pem}
  # https, nao http: em prd o mTLS do facial-svc e obrigatorio (ver o servico
  # `facial-svc` abaixo), e um servidor que exige certificado de cliente nao
  # responde em texto claro. Default errado aqui seria uma falha de conexao a
  # cada marcacao com facial, no deploy, e nao no `config`.
  FACIAL_SVC_URL: ${FACIAL_SVC_URL:-https://facial-svc:8000}
  # Obrigatorio em prd: sem Sentry, incidente de producao vira "o cliente
  # avisou". Se voce decidir conscientemente nao usar Sentry, troque por
  # ${SENTRY_DSN:-} e assuma a decisao por escrito no runbook.
  SENTRY_DSN: ${SENTRY_DSN:?defina SENTRY_DSN (ou remova o :? assumindo a decisao)}
  SENTRY_ENVIRONMENT: prd
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
  OTEL_SERVICE_NAMESPACE: ponto

# Healthcheck HTTP para servicos Python: usa a stdlib, nao exige curl na imagem.
x-healthcheck-http-py: &healthcheck-http-py
  test:
    - CMD-SHELL
    - >-
      python -c "import sys,urllib.request;
      sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).status == 200 else 1)"
  interval: 30s
  timeout: 10s
  retries: 5
  start_period: 40s

# Healthcheck do facial-svc: separado do bloco acima porque em prd este servico
# NUNCA fala HTTP puro (mTLS obrigatorio) — um GET em `http://127.0.0.1:8000`
# jamais completaria, o container nunca ficaria `healthy` e a `api`, que declara
# `depends_on: service_healthy` sobre ele, nunca subiria. O comando apresenta o
# proprio certificado do servidor como cliente; por isso
# `infra/gerar-certificados-mtls-facial.sh` emite o certificado de servidor com
# `extendedKeyUsage=serverAuth,clientAuth` e SAN `localhost`/`127.0.0.1`.
# A forma condicional (identica a de hml) e deliberada: um unico comando
# correto nos dois arquivos e mais facil de manter que dois comandos parecidos.
x-healthcheck-facial: &healthcheck-facial
  test:
    - CMD-SHELL
    - >-
      python -c "import os,ssl,sys,urllib.request as u;
      p=[os.environ.get(v) or '' for v in ('FACIAL_TLS_CERT_PATH','FACIAL_TLS_KEY_PATH','FACIAL_MTLS_CA_PATH')];
      m=all(p);
      x=ssl.create_default_context(cafile=p[2]) if m else None;
      x and x.load_cert_chain(p[0], p[1]);
      sys.exit(0 if u.urlopen(('https://localhost:8000/health' if m else 'http://127.0.0.1:8000/health'), timeout=5, context=x).status == 200 else 1)"
  interval: 30s
  timeout: 10s
  retries: 5
  start_period: 40s

# -----------------------------------------------------------------------------
# Redes
# -----------------------------------------------------------------------------
networks:
  # Nome LITERAL: nao herda COMPOSE_PROJECT_NAME. Impossivel colidir com a
  # `ponto-hml-interna` do stack de homologacao na mesma VPS.
  ponto-interna:
    name: ponto-prd-interna
    driver: bridge
    internal: false

  # Rede do Traefik global ja existente na VPS. Criada fora deste compose.
  traefik:
    external: true
    name: ${TRAEFIK_NETWORK:-traefik}

# -----------------------------------------------------------------------------
# Volumes — nomes literais `ponto-prd-*`, JAMAIS derivados de variavel.
# Um `COMPOSE_PROJECT_NAME` errado no .env nao consegue fazer producao montar
# o volume de homologacao (nem o contrario).
# -----------------------------------------------------------------------------
volumes:
  postgres-data:
    name: ponto-prd-postgres-data
  redis-data:
    name: ponto-prd-redis-data
  minio-data:
    name: ponto-prd-minio-data
  # Pesos ONNX do motor facial: grandes, fora do git, montados no facial-svc.
  facial-models:
    name: ponto-prd-facial-models

# =============================================================================
# Servicos
# =============================================================================
services:

  # ---------------------------------------------------------------------------
  # PostgreSQL 16 — banco canonico, com RLS multi-tenant (ver ADR-001)
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    <<: *restart
    logging: *logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?defina POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?defina POSTGRES_DB}
      # Collation deterministica: o motor de calculo compara strings de dominio.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
      TZ: ${TZ:-America/Sao_Paulo}
      PGTZ: ${TZ:-America/Sao_Paulo}
    command:
      - postgres
      - -c
      - max_connections=${POSTGRES_MAX_CONNECTIONS:-200}
      - -c
      - shared_buffers=${POSTGRES_SHARED_BUFFERS:-1GB}
      - -c
      - timezone=${TZ:-America/Sao_Paulo}
      # row_security nao pode ser desligado por sessao de aplicacao.
      - -c
      - row_security=on
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - ponto-interna
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB} -h 127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    labels:
      traefik.enable: "false"

  # ---------------------------------------------------------------------------
  # Redis 7 — fila do ARQ, cache e rate limiting
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    <<: *restart
    logging: *logging
    environment:
      TZ: ${TZ:-America/Sao_Paulo}
      # Usado apenas pelo healthcheck (redis-cli -a). O servidor recebe a senha
      # por --requirepass no command.
      REDIS_PASSWORD: ${REDIS_PASSWORD:?defina REDIS_PASSWORD}
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?defina REDIS_PASSWORD}
      - --appendonly
      - "yes"
      - --maxmemory
      - ${REDIS_MAXMEMORY:-1gb}
      # noeviction: a fila do ARQ nao pode perder job por pressao de memoria.
      - --maxmemory-policy
      - noeviction
    volumes:
      - redis-data:/data
    networks:
      - ponto-interna
    expose:
      - "6379"
    healthcheck:
      test:
        - CMD-SHELL
        - redis-cli --no-auth-warning -a "$${REDIS_PASSWORD}" ping | grep -q PONG
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    labels:
      traefik.enable: "false"

  # ---------------------------------------------------------------------------
  # MinIO — objetos: fotos de captura, anexos, PDFs, AFD/AEJ e .p7s
  #
  # CONSOLE WEB DESLIGADO EM PRODUCAO, e de forma nao-reversivel por .env:
  #   * `MINIO_BROWSER: "off"` literal (em hml vem de variavel);
  #   * `--console-address` removido do command;
  #   * porta 9001 nao aparece em `expose`;
  #   * NENHUM bloco de label do Traefik, nem comentado — em hml existia um
  #     bloco comentado que so faltava alguem descomentar.
  # Administracao de bucket em prd: tunel SSH ate a VPS + cliente `mc` contra
  # a porta 9000 na rede interna. Ver docs/runbook-deploy-producao.md.
  # ---------------------------------------------------------------------------
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    <<: *restart
    logging: *logging
    command: server /data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?defina MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?defina MINIO_ROOT_PASSWORD}
      MINIO_BROWSER: "off"
      MINIO_REGION: ${MINIO_REGION:-us-east-1}
      TZ: ${TZ:-America/Sao_Paulo}
    volumes:
      - minio-data:/data
    networks:
      - ponto-interna
    expose:
      - "9000"
    healthcheck:
      test: ["CMD-SHELL", "mc ready local"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    labels:
      traefik.enable: "false"

  # ---------------------------------------------------------------------------
  # facial-svc — motor facial self-hosted (analise-facial-edge / ArcFace ONNX)
  # Interno por definicao: biometria nunca sai da rede privada (LGPD, D4).
  #
  # mTLS (F14/A2): em producao os TRES caminhos abaixo sao OBRIGATORIOS. Se
  # qualquer um estiver vazio, `facial/servidor.py` sobe em HTTP puro — aceito
  # em dev/hml, inaceitavel em prd (biometria em claro entre containers).
  # Aqui o compose falha antes de subir, em vez de degradar em silencio.
  # ---------------------------------------------------------------------------
  facial-svc:
    image: ${REGISTRY:?defina REGISTRY}/ponto-facial-svc:${TAG:?defina TAG (SHA curto, nunca latest)}
    <<: *restart
    logging: *logging
    environment:
      AMBIENTE: prd
      TZ: ${TZ:-America/Sao_Paulo}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      FACIAL_MODEL_DIR: ${FACIAL_MODEL_DIR:-/models}
      FACIAL_MODEL_VERSAO: ${FACIAL_MODEL_VERSAO:?defina FACIAL_MODEL_VERSAO}
      FACIAL_LIMIAR_SIMILARIDADE: ${FACIAL_LIMIAR_SIMILARIDADE:-0.42}
      FACIAL_MTLS_CA_PATH: ${FACIAL_MTLS_CA_PATH:?defina FACIAL_MTLS_CA_PATH (mTLS obrigatorio em prd)}
      FACIAL_TLS_CERT_PATH: ${FACIAL_TLS_CERT_PATH:?defina FACIAL_TLS_CERT_PATH (mTLS obrigatorio em prd)}
      FACIAL_TLS_KEY_PATH: ${FACIAL_TLS_KEY_PATH:?defina FACIAL_TLS_KEY_PATH (mTLS obrigatorio em prd)}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      SENTRY_DSN: ${SENTRY_DSN:?defina SENTRY_DSN}
    volumes:
      - facial-models:/models
      # Diretorio do HOST com CA + cert + key do mTLS, so leitura. Obrigatorio
      # em prd (em hml havia um default vazio inofensivo; aqui, nao ha default).
      - ${FACIAL_CERTS_DIR:?defina FACIAL_CERTS_DIR}:/run/secrets/facial-tls:ro
    networks:
      - ponto-interna
    expose:
      - "8000"
    healthcheck: *healthcheck-facial
    labels:
      traefik.enable: "false"

  # ---------------------------------------------------------------------------
  # api — FastAPI. Rota publica: api.ponto.${DOMINIO}
  # Tambem serve o portal OpenAPI em docs.ponto.${DOMINIO} (router separado).
  # ---------------------------------------------------------------------------
  api:
    image: ${REGISTRY:?defina REGISTRY}/ponto-api:${TAG:?defina TAG (SHA curto, nunca latest)}
    <<: *restart
    logging: *logging
    environment:
      <<: *python-env
      OTEL_SERVICE_NAME: ponto-api
      API_BASE_URL: https://api.ponto.${DOMINIO:?defina DOMINIO}
      WEB_BASE_URL: https://ponto.${DOMINIO:?defina DOMINIO}
      DOCS_BASE_URL: https://docs.ponto.${DOMINIO:?defina DOMINIO}
      CORS_ORIGENS: ${CORS_ORIGENS:-https://ponto.${DOMINIO}}
      # Em prd a API esta atras do Traefik: sem esta lista, o IP de origem
      # registrado em auditoria e o do proxy, nao o do usuario.
      PROXIES_CONFIAVEIS: ${PROXIES_CONFIAVEIS:?defina PROXIES_CONFIAVEIS (CIDR da rede do Traefik)}
      INPI_NUMERO: ${INPI_NUMERO:-}
      # Certificado ICP-Brasil que assina AFD/AEJ e espelhos (.p7s).
      CERT_ICP_PATH: ${CERT_ICP_PATH:?defina CERT_ICP_PATH}
      CERT_ICP_SENHA: ${CERT_ICP_SENHA:?defina CERT_ICP_SENHA}
      UVICORN_WORKERS: ${API_WORKERS:-4}
      # --- mTLS api -> facial-svc: lado CLIENTE do par (F14/A2) ---
      # Obrigatorio em prd pelo mesmo motivo que o lado servidor: sem isto,
      # `app/biometria/cliente_facial.py` recusa montar o cliente em producao
      # (`MtlsNaoConfigurado` -> `PONTO-INT-001`) e TODA operacao facial falha.
      # Ficam aqui e nao em `x-python-env`: a `api` e o unico caller do motor.
      # Emita o par com `infra/gerar-certificados-mtls-facial.sh`.
      FACIAL_MTLS_CERT_PATH: ${FACIAL_MTLS_CERT_PATH:?defina FACIAL_MTLS_CERT_PATH (mTLS obrigatorio em prd)}
      FACIAL_MTLS_KEY_PATH: ${FACIAL_MTLS_KEY_PATH:?defina FACIAL_MTLS_KEY_PATH (mTLS obrigatorio em prd)}
      # Mesma variavel (e mesmo valor) que o facial-svc le: os dois diretorios
      # de certificado sao montados no MESMO caminho de container, cada um com
      # a sua copia de ca.pem.
      FACIAL_MTLS_CA_PATH: ${FACIAL_MTLS_CA_PATH:?defina FACIAL_MTLS_CA_PATH (mTLS obrigatorio em prd)}
    volumes:
      # Chaves JWT geradas fora do git (make keys). Somente leitura.
      # Em prd nao ha default `./keys`: o caminho tem que ser declarado.
      - ${JWT_KEYS_DIR:?defina JWT_KEYS_DIR}:/run/secrets/jwt:ro
      - ${CERT_ICP_DIR:?defina CERT_ICP_DIR}:/run/secrets/icp:ro
      # Certificado de CLIENTE do mTLS (ca.pem + cliente.pem + cliente.key).
      # Diretorio de host DIFERENTE do FACIAL_CERTS_DIR do facial-svc de
      # proposito: a chave privada do servidor nunca fica visivel dentro da
      # api, e a do cliente nunca dentro do facial-svc.
      - ${FACIAL_CERTS_CLIENTE_DIR:?defina FACIAL_CERTS_CLIENTE_DIR}:/run/secrets/facial-tls:ro
    networks:
      - ponto-interna
      - traefik
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      facial-svc:
        condition: service_healthy
    healthcheck: *healthcheck-http-py
    labels:
      traefik.enable: "true"
      traefik.docker.network: ${TRAEFIK_NETWORK:-traefik}

      # --- API: api.ponto.${DOMINIO} ---
      traefik.http.routers.ponto-prd-api.rule: Host(`api.ponto.${DOMINIO}`)
      traefik.http.routers.ponto-prd-api.entrypoints: websecure
      traefik.http.routers.ponto-prd-api.tls: "true"
      traefik.http.routers.ponto-prd-api.tls.certresolver: ${TRAEFIK_CERTRESOLVER:-letsencrypt}
      traefik.http.routers.ponto-prd-api.service: ponto-prd-api
      traefik.http.routers.ponto-prd-api.middlewares: ponto-prd-api-headers

      # --- Portal OpenAPI: docs.ponto.${DOMINIO} ---
      traefik.http.routers.ponto-prd-docs.rule: Host(`docs.ponto.${DOMINIO}`)
      traefik.http.routers.ponto-prd-docs.entrypoints: websecure
      traefik.http.routers.ponto-prd-docs.tls: "true"
      traefik.http.routers.ponto-prd-docs.tls.certresolver: ${TRAEFIK_CERTRESOLVER:-letsencrypt}
      traefik.http.routers.ponto-prd-docs.service: ponto-prd-api
      traefik.http.routers.ponto-prd-docs.middlewares: ponto-prd-docs-raiz,ponto-prd-api-headers

      traefik.http.middlewares.ponto-prd-docs-raiz.replacepathregex.regex: ^/$$
      traefik.http.middlewares.ponto-prd-docs-raiz.replacepathregex.replacement: /docs

      # --- Cabecalhos de seguranca comuns ---
      traefik.http.middlewares.ponto-prd-api-headers.headers.stsSeconds: "31536000"
      traefik.http.middlewares.ponto-prd-api-headers.headers.stsIncludeSubdomains: "true"
      traefik.http.middlewares.ponto-prd-api-headers.headers.stsPreload: "true"
      traefik.http.middlewares.ponto-prd-api-headers.headers.contentTypeNosniff: "true"
      traefik.http.middlewares.ponto-prd-api-headers.headers.frameDeny: "true"
      traefik.http.middlewares.ponto-prd-api-headers.headers.browserXssFilter: "true"
      traefik.http.middlewares.ponto-prd-api-headers.headers.referrerPolicy: strict-origin-when-cross-origin

      traefik.http.services.ponto-prd-api.loadbalancer.server.port: "8000"
      traefik.http.services.ponto-prd-api.loadbalancer.healthcheck.path: /health
      traefik.http.services.ponto-prd-api.loadbalancer.healthcheck.interval: 30s

  # ---------------------------------------------------------------------------
  # worker — ARQ. Apuracao, geracao de AFD/AEJ, relatorios, webhooks.
  # ---------------------------------------------------------------------------
  worker:
    image: ${REGISTRY:?defina REGISTRY}/ponto-worker:${TAG:?defina TAG (SHA curto, nunca latest)}
    <<: *restart
    logging: *logging
    command: ["arq", "${ARQ_WORKER_SETTINGS:-worker.main.WorkerSettings}"]
    environment:
      <<: *python-env
      OTEL_SERVICE_NAME: ponto-worker
      ARQ_WORKER_SETTINGS: ${ARQ_WORKER_SETTINGS:-worker.main.WorkerSettings}
      ARQ_MAX_JOBS: ${ARQ_MAX_JOBS:-10}
      CERT_ICP_PATH: ${CERT_ICP_PATH:?defina CERT_ICP_PATH}
      CERT_ICP_SENHA: ${CERT_ICP_SENHA:?defina CERT_ICP_SENHA}
      INPI_NUMERO: ${INPI_NUMERO:-}
    volumes:
      - ${JWT_KEYS_DIR:?defina JWT_KEYS_DIR}:/run/secrets/jwt:ro
      - ${CERT_ICP_DIR:?defina CERT_ICP_DIR}:/run/secrets/icp:ro
    networks:
      - ponto-interna
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      api:
        condition: service_healthy
    # `arq --check` retorna 0 quando a chave de saude no Redis esta fresca.
    healthcheck:
      test: ["CMD-SHELL", "arq --check $${ARQ_WORKER_SETTINGS}"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s
    labels:
      traefik.enable: "false"

  # ---------------------------------------------------------------------------
  # scheduler — ARQ com cron: fechamento, vencimento de banco de horas,
  # expurgo LGPD, coleta de terminais, relatorios agendados.
  # ---------------------------------------------------------------------------
  scheduler:
    image: ${REGISTRY:?defina REGISTRY}/ponto-worker:${TAG:?defina TAG (SHA curto, nunca latest)}
    <<: *restart
    logging: *logging
    command: ["arq", "${ARQ_SCHEDULER_SETTINGS:-worker.scheduler.SchedulerSettings}"]
    environment:
      <<: *python-env
      OTEL_SERVICE_NAME: ponto-scheduler
      ARQ_WORKER_SETTINGS: ${ARQ_SCHEDULER_SETTINGS:-worker.scheduler.SchedulerSettings}
      ARQ_MAX_JOBS: ${ARQ_SCHEDULER_MAX_JOBS:-2}
    volumes:
      - ${JWT_KEYS_DIR:?defina JWT_KEYS_DIR}:/run/secrets/jwt:ro
    networks:
      - ponto-interna
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "arq --check $${ARQ_WORKER_SETTINGS}"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s
    labels:
      traefik.enable: "false"

  # ---------------------------------------------------------------------------
  # device-gw — gateway Control iD (Push/Monitor). Rota: dev.ponto.${DOMINIO}
  # Isolado da API principal de proposito: rajada de terminal nao derruba a API.
  # ---------------------------------------------------------------------------
  device-gw:
    image: ${REGISTRY:?defina REGISTRY}/ponto-device-gw:${TAG:?defina TAG (SHA curto, nunca latest)}
    <<: *restart
    logging: *logging
    environment:
      <<: *python-env
      OTEL_SERVICE_NAME: ponto-device-gw
      API_BASE_URL: http://api:8000
      CONTROLID_USUARIO: ${CONTROLID_USUARIO:?defina CONTROLID_USUARIO}
      CONTROLID_SENHA: ${CONTROLID_SENHA:?defina CONTROLID_SENHA}
      CONTROLID_TIMEOUT_S: ${CONTROLID_TIMEOUT_S:-10}
      CONTROLID_PUSH_TOKEN: ${CONTROLID_PUSH_TOKEN:?defina CONTROLID_PUSH_TOKEN}
      # Literal `false`: o simulador de terminal nunca pode ligar em producao.
      CONTROLID_SIMULADOR: "false"
    volumes:
      - ${JWT_KEYS_DIR:?defina JWT_KEYS_DIR}:/run/secrets/jwt:ro
    networks:
      - ponto-interna
      - traefik
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    healthcheck: *healthcheck-http-py
    labels:
      traefik.enable: "true"
      traefik.docker.network: ${TRAEFIK_NETWORK:-traefik}
      traefik.http.routers.ponto-prd-devgw.rule: Host(`dev.ponto.${DOMINIO}`)
      traefik.http.routers.ponto-prd-devgw.entrypoints: websecure
      traefik.http.routers.ponto-prd-devgw.tls: "true"
      traefik.http.routers.ponto-prd-devgw.tls.certresolver: ${TRAEFIK_CERTRESOLVER:-letsencrypt}
      traefik.http.routers.ponto-prd-devgw.service: ponto-prd-devgw
      traefik.http.services.ponto-prd-devgw.loadbalancer.server.port: "8000"
      traefik.http.services.ponto-prd-devgw.loadbalancer.healthcheck.path: /health
      traefik.http.services.ponto-prd-devgw.loadbalancer.healthcheck.interval: 30s

  # ---------------------------------------------------------------------------
  # web — Next.js 15 (App Router). Rota: ponto.${DOMINIO}
  # ---------------------------------------------------------------------------
  web:
    image: ${REGISTRY:?defina REGISTRY}/ponto-web:${TAG:?defina TAG (SHA curto, nunca latest)}
    <<: *restart
    logging: *logging
    environment:
      NODE_ENV: production
      AMBIENTE: prd
      TZ: ${TZ:-America/Sao_Paulo}
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_API_URL: https://api.ponto.${DOMINIO:?defina DOMINIO}
      NEXT_PUBLIC_AMBIENTE: prd
      NEXT_PUBLIC_SENTRY_DSN: ${SENTRY_DSN_WEB:-}
      # Chamada servidor->servidor fica na rede interna, sem sair pela internet.
      API_INTERNAL_URL: http://api:8000
      NEXTAUTH_URL: https://ponto.${DOMINIO:?defina DOMINIO}
    networks:
      - ponto-interna
      - traefik
    expose:
      - "3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          node -e "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    labels:
      traefik.enable: "true"
      traefik.docker.network: ${TRAEFIK_NETWORK:-traefik}
      traefik.http.routers.ponto-prd-web.rule: Host(`ponto.${DOMINIO}`)
      traefik.http.routers.ponto-prd-web.entrypoints: websecure
      traefik.http.routers.ponto-prd-web.tls: "true"
      traefik.http.routers.ponto-prd-web.tls.certresolver: ${TRAEFIK_CERTRESOLVER:-letsencrypt}
      traefik.http.routers.ponto-prd-web.service: ponto-prd-web
      traefik.http.routers.ponto-prd-web.middlewares: ponto-prd-web-headers
      traefik.http.middlewares.ponto-prd-web-headers.headers.stsSeconds: "31536000"
      traefik.http.middlewares.ponto-prd-web-headers.headers.stsIncludeSubdomains: "true"
      traefik.http.middlewares.ponto-prd-web-headers.headers.stsPreload: "true"
      traefik.http.middlewares.ponto-prd-web-headers.headers.contentTypeNosniff: "true"
      traefik.http.middlewares.ponto-prd-web-headers.headers.referrerPolicy: strict-origin-when-cross-origin
      traefik.http.services.ponto-prd-web.loadbalancer.server.port: "3000"
      traefik.http.services.ponto-prd-web.loadbalancer.healthcheck.path: /api/health
      traefik.http.services.ponto-prd-web.loadbalancer.healthcheck.interval: 30s
