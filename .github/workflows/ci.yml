# =============================================================================
# CI — Ponto Eletronico
# =============================================================================
# Jobs paralelos:
#   deteccao              descobre quais arvores do monorepo ja existem
#   lint-python            ruff (lint + format) + mypy
#   test-python            pytest com servico PostgreSQL 16 real
#   contrato-schemathesis  Schemathesis contra a API real subida (F13/A1, T6)
#   semgrep                Varredura estatica de seguranca (F14/A2)
#   codeql                 Varredura estatica de seguranca (F14/A2)
#   web                    eslint + tsc --noEmit + next build
#   openapi                spectral lint sobre packages/contracts/openapi.yaml
#   docker                 build das imagens (sem push)
#   ci-ok                  gate agregador para branch protection
#
# -----------------------------------------------------------------------------
# NOTA SOBRE O JOB `deteccao` (concessao explicita e temporaria da Fase 0)
# -----------------------------------------------------------------------------
# A Fase 0 e construida por agentes em paralelo: o andaime de infra/CI nasce
# antes de apps/ e packages/contracts/ estarem no repositorio. Sem um guarda,
# o primeiro push ficaria vermelho por ausencia de arquivo, e nao por defeito.
#
# A saida escolhida NAO mascara erro: o job `deteccao` apenas responde
# "esta arvore existe?". Quando a resposta e nao, o job dependente e PULADO
# (status skipped, visivel no PR) — nunca "passa" com erro engolido. Quando a
# resposta e sim, o job roda em modo estrito: sem `|| true`, sem
# `continue-on-error`, qualquer achado reprova.
#
# Consequencia pratica: no dia em que openapi.yaml existir, o spectral passa a
# ser bloqueante automaticamente e para sempre. Um `continue-on-error: true`
# teria o efeito oposto — continuaria verde depois que o arquivo chegasse, que
# e exatamente o mascaramento que queremos evitar.
#
# REMOVER apos o fim da Fase 0: com o monorepo completo, os `if:` devem cair e
# todos os jobs passam a ser incondicionais.
# =============================================================================

name: CI

on:
  push:
    branches: [main, "f*-**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "24"
  PNPM_VERSION: "9"
  # Ferramental de lint/tipos/teste fixado aqui para o CI ser reprodutivel
  # mesmo antes de apps/api trazer o proprio arquivo de dependencias.
  PY_TOOLING: "ruff==0.7.4 mypy==1.13.0 pytest==8.3.4 pytest-asyncio==0.24.0 pytest-cov==6.0.0"

jobs:

  # ---------------------------------------------------------------------------
  # Descobre o que ja existe no monorepo. Ver nota no cabecalho.
  # ---------------------------------------------------------------------------
  deteccao:
    name: Deteccao de arvores
    runs-on: ubuntu-latest
    outputs:
      tem_python: ${{ steps.check.outputs.tem_python }}
      tem_web: ${{ steps.check.outputs.tem_web }}
      tem_openapi: ${{ steps.check.outputs.tem_openapi }}
      dockerfiles: ${{ steps.check.outputs.dockerfiles }}
      tem_dockerfile: ${{ steps.check.outputs.tem_dockerfile }}
    steps:
      - uses: actions/checkout@v4

      - id: check
        name: Verifica presenca de codigo por arvore
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          tem_python=false
          if [ -d apps ] && [ -n "$(find apps -name '*.py' -not -path '*/node_modules/*' -print -quit)" ]; then
            tem_python=true
          fi

          tem_web=false
          if [ -f apps/web/package.json ]; then
            tem_web=true
          fi

          tem_openapi=false
          if [ -f packages/contracts/openapi.yaml ]; then
            tem_openapi=true
          fi

          # Matriz de imagens: so entra servico cujo Dockerfile ja existe.
          servicos=(api worker device-gw facial-svc web)
          encontrados=()
          for s in "${servicos[@]}"; do
            if [ -f "apps/$s/Dockerfile" ]; then
              encontrados+=("$s")
            fi
          done

          if [ ${#encontrados[@]} -gt 0 ]; then
            matriz=$(printf '"%s",' "${encontrados[@]}")
            matriz="[${matriz%,}]"
            tem_dockerfile=true
          else
            matriz='[]'
            tem_dockerfile=false
          fi

          {
            echo "tem_python=$tem_python"
            echo "tem_web=$tem_web"
            echo "tem_openapi=$tem_openapi"
            echo "tem_dockerfile=$tem_dockerfile"
            echo "dockerfiles=$matriz"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### Deteccao de arvores"
            echo ""
            echo "| Arvore | Presente |"
            echo "|---|---|"
            echo "| Python (apps/*) | $tem_python |"
            echo "| Web (apps/web) | $tem_web |"
            echo "| OpenAPI (packages/contracts/openapi.yaml) | $tem_openapi |"
            echo "| Dockerfiles | $matriz |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # (a) Lint e tipos Python
  # ---------------------------------------------------------------------------
  lint-python:
    name: Python · ruff + mypy
    needs: deteccao
    if: needs.deteccao.outputs.tem_python == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Instala ferramental e dependencias das apps
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          python -m pip install --upgrade pip
          pip install ${{ env.PY_TOOLING }}
          # packages/ ANTES de apps/: `apps/api` importa `ponto_contracts`
          # (migrations/env.py e seed_dev.py). Sem esta instalacao o mypy
          # reprova com import-not-found e o alembic cai no fallback de sys.path.
          #
          # NAO editavel de proposito: instalacao editavel (PEP 660) usa um
          # importador dinamico que o mypy nao segue, e o erro import-not-found
          # continuaria mesmo com o pacote instalado. Aqui packages/ e
          # dependencia, nao codigo em edicao.
          for proj in packages/*/pyproject.toml; do
            dir=$(dirname "$proj")
            echo "::group::pip install $dir"
            pip install "$dir[dev]" || pip install "$dir"
            echo "::endgroup::"
          done
          # nullglob: glob sem correspondencia some, o laco simplesmente nao roda.
          for req in apps/*/requirements.txt apps/*/requirements-dev.txt; do
            echo "::group::pip install -r $req"
            pip install -r "$req"
            echo "::endgroup::"
          done
          for proj in apps/*/pyproject.toml; do
            dir=$(dirname "$proj")
            echo "::group::pip install -e $dir"
            pip install -e "$dir[dev]" || pip install -e "$dir"
            echo "::endgroup::"
          done

      - name: ruff check
        run: ruff check apps packages tests --output-format=github

      - name: ruff format (verificacao)
        run: ruff format --check --diff apps packages tests

      - name: mypy
        # RFC-009: `mypy apps packages` (um unico comando, da raiz do repo) nunca
        # encontra o `[tool.mypy]` de nenhum app -- mypy so descobre config
        # subindo a partir do diretorio corrente, ao contrario do ruff (que
        # aplica o pyproject.toml mais proximo por arquivo). Sem config, mypy
        # roda em modo relaxado e silenciosamente deixa de aplicar `strict`,
        # os excludes e os `ignore_missing_imports` que cada app declara. Cada
        # app tem seu proprio `[tool.mypy]` com `files = [...]` (nenhum
        # argumento extra necessario quando rodado de dentro do app).
        run: |
          set -euo pipefail
          for dir in apps/api apps/worker apps/device-gw apps/facial-svc; do
            if [ -f "$dir/pyproject.toml" ]; then
              echo "::group::mypy $dir"
              (cd "$dir" && mypy)
              echo "::endgroup::"
            fi
          done

  # ---------------------------------------------------------------------------
  # (b) Testes Python com PostgreSQL 16 de verdade
  #     RLS, triggers append-only e sequencia de NSR nao sao testaveis em SQLite.
  # ---------------------------------------------------------------------------
  test-python:
    name: Python · pytest
    needs: deteccao
    if: needs.deteccao.outputs.tem_python == 'true'
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ponto
          POSTGRES_PASSWORD: ponto_ci
          POSTGRES_DB: ponto_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ponto -d ponto_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      AMBIENTE: ci
      TZ: America/Sao_Paulo
      DATABASE_URL: postgresql+asyncpg://ponto:ponto_ci@localhost:5432/ponto_test
      DATABASE_URL_SYNC: postgresql+psycopg://ponto:ponto_ci@localhost:5432/ponto_test
      # F5 em diante usam um padrao proprio de fixture (conexao "superusuario"
      # via PONTO_TEST_DATABASE_URL, pra poder criar roles de LOGIN sem
      # BYPASSRLS por sessao de teste -- testar RLS conectado como
      # superusuario nao prova nada). Nunca foi setada aqui: toda essa
      # familia de fixtures (26 conftest.py, f1 a f14) caia no default de
      # desenvolvimento local de cada uma (tunel SSH pra VPS, porta 15432 ou
      # equivalente) -- nunca alcancavel do runner do CI. "ponto" e o
      # POSTGRES_USER do servico acima, que a imagem oficial do Postgres
      # sempre cria como superuser de verdade, entao a mesma URL do
      # DATABASE_URL serve.
      PONTO_TEST_DATABASE_URL: postgresql+asyncpg://ponto:ponto_ci@localhost:5432/ponto_test
      REDIS_URL: redis://localhost:6379/0

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Instala ferramental e dependencias das apps
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          python -m pip install --upgrade pip
          pip install ${{ env.PY_TOOLING }}
          # packages/ ANTES de apps/: o alembic desta etapa importa
          # `ponto_contracts` para montar o `target_metadata`.
          for proj in packages/*/pyproject.toml; do
            dir=$(dirname "$proj")
            echo "::group::pip install $dir"
            pip install "$dir[dev]" || pip install "$dir"
            echo "::endgroup::"
          done
          # nullglob: glob sem correspondencia some, o laco simplesmente nao roda.
          for req in apps/*/requirements.txt apps/*/requirements-dev.txt; do
            echo "::group::pip install -r $req"
            pip install -r "$req"
            echo "::endgroup::"
          done
          for proj in apps/*/pyproject.toml; do
            dir=$(dirname "$proj")
            echo "::group::pip install -e $dir"
            pip install -e "$dir[dev]" || pip install -e "$dir"
            echo "::endgroup::"
          done

      - name: Migrations Alembic (aplica e reverte)
        shell: bash
        run: |
          set -euo pipefail
          if [ -f apps/api/alembic.ini ]; then
            cd apps/api
            alembic upgrade head
            alembic downgrade base
            alembic upgrade head
          else
            echo "::notice::alembic.ini ainda nao existe; etapa pulada nesta execucao."
          fi

      - name: pytest
        shell: bash
        run: |
          # +e explicito: o shell "bash" do Actions roda com -e por padrao
          # (bash --noprofile --norc -eo pipefail {0}), o que abortava o
          # laco inteiro no primeiro app que falhasse -- worker/device-gw/
          # facial-svc nunca chegavam a rodar (achado real: primeira
          # validacao apos o fix de colisao de coleta, exit code do laco so
          # tinha um "::group::pytest api" e nada depois).
          set +e
          set -uo pipefail
          # Cada app roda em processo isolado, com cwd == raiz do app: e o
          # unico jeito de o pytest respeitar o [tool.pytest.ini_options] de
          # cada apps/*/pyproject.toml (asyncio_mode etc.) e, principalmente,
          # de evitar a colisao de nomes entre apps/api/tests e
          # apps/worker/tests (ambos pacotes `tests`, ambos com __init__.py) --
          # rodar tudo de uma vez a partir da raiz do monorepo faz o pytest
          # registrar dois modulos/plugins sob o mesmo nome pontilhado
          # (`tests.f14.lgpd.conftest`), e o segundo que tenta se registrar
          # explode com ImportPathMismatchError/ModuleNotFoundError/ValueError
          # de plugin duplicado -- achado real: F13 e F14 adicionaram
          # apps/worker/tests/{f13/webhooks,f13/importadores/afd_terceiro,
          # f14/lgpd} espelhando caminhos ja existentes em apps/api/tests, e a
          # execucao unica global travava a coleta inteira (0 testes rodados).
          falha=0
          for proj in apps/*/pyproject.toml; do
            dir=$(dirname "$proj")
            nome=$(basename "$dir")
            [ -d "$dir/tests" ] || continue
            echo "::group::pytest $nome"
            (cd "$dir" && pytest -q --cov --cov-report=xml --cov-report=term-missing)
            status=$?
            echo "::endgroup::"
            if [ "$status" -ne 0 ]; then
              echo "::error::pytest falhou em $nome (exit $status)"
              falha=1
            fi
            [ -f "$dir/coverage.xml" ] && mv "$dir/coverage.xml" "coverage-$nome.xml"
          done
          exit $falha

      - name: Publica relatorio de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-python
          path: coverage-*.xml
          if-no-files-found: ignore
          retention-days: 7

  # ---------------------------------------------------------------------------
  # (b2) Schemathesis contra o contrato, com a API real subida (F13/A1, T6)
  #
  # Citada como ferramenta desta fase em `packages/contracts/README.md`/
  # `ADR-005` desde a Fase 0, mas nunca instalada nem usada ate esta fase
  # (achado do PCF F13, T6). Roda em paralelo ao job `openapi` (que so faz
  # `spectral lint`, estatico, sem subir processo nenhum) -- este job sobe a
  # API de verdade e compara o contrato contra respostas reais. Rotas ainda em
  # 501 (`PONTO-INT-005`, fases futuras) respondem de forma consistente com o
  # catalogo e nao contam como divergencia -- Schemathesis compara forma de
  # resposta contra o schema declarado, nao se a regra de negocio existe.
  # ---------------------------------------------------------------------------
  contrato-schemathesis:
    name: Contrato · schemathesis
    needs: deteccao
    if: needs.deteccao.outputs.tem_openapi == 'true' && needs.deteccao.outputs.tem_python == 'true'
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ponto
          POSTGRES_PASSWORD: ponto_ci
          POSTGRES_DB: ponto_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ponto -d ponto_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      AMBIENTE: ci
      TZ: America/Sao_Paulo
      DATABASE_URL: postgresql+asyncpg://ponto:ponto_ci@localhost:5432/ponto_test
      REDIS_URL: redis://localhost:6379/0
      JWT_PRIVATE_KEY_PATH: /tmp/jwt-ci/private.pem
      JWT_PUBLIC_KEY_PATH: /tmp/jwt-ci/public.pem

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Instala ferramental e dependencias das apps
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          # Teto em <4.0 de proposito: a serie 4.x exige pytest>=9,
          # incompativel com o pytest==8.3.4 fixado em apps/api/pyproject.toml
          # (ver nota la -- instalar 4.x quebra a suite inteira do monorepo).
          pip install "schemathesis>=3.35,<4.0"
          for proj in packages/*/pyproject.toml; do
            dir=$(dirname "$proj")
            echo "::group::pip install $dir"
            pip install "$dir[dev]" || pip install "$dir"
            echo "::endgroup::"
          done
          for proj in apps/api/pyproject.toml; do
            dir=$(dirname "$proj")
            echo "::group::pip install -e $dir"
            pip install -e "$dir[dev]" || pip install -e "$dir"
            echo "::endgroup::"
          done

      - name: Gera par de chaves JWT descartavel (so para este job)
        run: |
          set -euo pipefail
          mkdir -p /tmp/jwt-ci
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out /tmp/jwt-ci/private.pem
          openssl rsa -pubout -in /tmp/jwt-ci/private.pem -out /tmp/jwt-ci/public.pem

      - name: Migrations Alembic
        working-directory: apps/api
        run: alembic upgrade head

      - name: Sobe a API em segundo plano
        working-directory: apps/api
        run: |
          set -euo pipefail
          nohup uvicorn app.main:app --host 0.0.0.0 --port 8000 \
            > /tmp/api-schemathesis.log 2>&1 &
          echo $! > /tmp/api-schemathesis.pid
          for _ in $(seq 1 30); do
            if curl -sf http://localhost:8000/health >/dev/null; then
              echo "API pronta."
              exit 0
            fi
            sleep 2
          done
          echo "::error::API nao respondeu /health a tempo."
          cat /tmp/api-schemathesis.log
          exit 1

      - name: schemathesis run
        run: |
          # --experimental=openapi-3.1 e obrigatorio: o contrato declara
          # `openapi: 3.1.0` e a serie 3.x do schemathesis so suporta 3.1 via
          # essa flag -- sem ela, falha antes de carregar o schema.
          schemathesis run packages/contracts/openapi.yaml \
            --base-url http://localhost:8000 \
            --checks all \
            --experimental=openapi-3.1

      - name: Encerra a API
        if: always()
        run: |
          if [ -f /tmp/api-schemathesis.pid ]; then
            kill "$(cat /tmp/api-schemathesis.pid)" 2>/dev/null || true
          fi

      - name: Publica log da API (em caso de falha)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: api-log-schemathesis
          path: /tmp/api-schemathesis.log
          if-no-files-found: ignore
          retention-days: 7

  # ---------------------------------------------------------------------------
  # (b2) Varredura estatica de seguranca -- Semgrep (F14/A2, hardening)
  #
  # Mesmo padrao do job `contrato-schemathesis` acima: sobe/analisa e publica
  # achado, sem `|| true`/`continue-on-error` (achado novo reprova o build).
  #
  # `_ACHADOS_TRIADOS` (script Python abaixo) é a allowlist de achados JA
  # revisados por A2 nesta fase e confirmados falso-positivo/risco aceito, com
  # justificativa por escrito -- ver `docs/backlog.md` (2026-08-05) para o
  # relatorio completo de cada um. Achado NOVO (fora desta lista) reprova o
  # job; a lista so cresce por decisao consciente, nunca por conveniencia.
  # ---------------------------------------------------------------------------
  semgrep:
    name: Seguranca · Semgrep
    needs: deteccao
    if: needs.deteccao.outputs.tem_python == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Instala semgrep
        run: pip install semgrep

      - name: semgrep (Python -- apps/api, apps/device-gw, apps/facial-svc, apps/worker)
        run: |
          semgrep \
            --config=p/security-audit --config=p/secrets \
            --config=p/owasp-top-ten --config=p/python --config=p/sql-injection \
            --metrics=off --severity=ERROR --severity=WARNING \
            --exclude=".venv" --exclude="node_modules" --exclude="build" \
            --exclude=".next" --exclude="__pycache__" \
            --json --output semgrep-python.json \
            apps/api/app apps/device-gw/gateway apps/facial-svc/facial apps/worker/worker

      - name: semgrep (web -- TypeScript/React/Next.js)
        if: needs.deteccao.outputs.tem_web == 'true'
        run: |
          semgrep \
            --config=p/security-audit --config=p/secrets \
            --config=p/owasp-top-ten --config=p/typescript --config=p/nextjs --config=p/react \
            --metrics=off --severity=ERROR --severity=WARNING \
            --exclude=".venv" --exclude="node_modules" --exclude="build" \
            --exclude=".next" --exclude="__pycache__" \
            --json --output semgrep-web.json \
            apps/web/src

      - name: Filtra achados triados e reprova em achado novo
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import sys

          # Achados revisados por A2 (F14) e confirmados falso-positivo/risco
          # aceito, com justificativa completa em `docs/backlog.md`
          # (2026-08-05, entradas "F14 / A2"). (check_id, caminho, linha).
          ACHADOS_TRIADOS = {
              (
                  "python.sqlalchemy.security.audit.avoid-sqlalchemy-text.avoid-sqlalchemy-text",
                  "apps/device-gw/gateway/dominio/terminais.py",
                  79,
              ),
              (
                  "python.sqlalchemy.security.audit.avoid-sqlalchemy-text.avoid-sqlalchemy-text",
                  "apps/device-gw/gateway/dominio/terminais.py",
                  91,
              ),
          }

          total_novos = 0
          for arquivo in ("semgrep-python.json", "semgrep-web.json"):
              try:
                  dados = json.load(open(arquivo, encoding="utf-8"))
              except FileNotFoundError:
                  continue
              for r in dados.get("results", []):
                  chave = (r["check_id"], r["path"].replace("\\", "/"), r["start"]["line"])
                  if chave in ACHADOS_TRIADOS:
                      print(f"[triado, ignorado] {chave}")
                      continue
                  total_novos += 1
                  print(f"::error file={r['path']},line={r['start']['line']}::{r['check_id']}: {r['extra']['message']}")

          if total_novos:
              print(f"\n{total_novos} achado(s) NOVO(S) de severidade ERROR/WARNING, fora da allowlist triada.")
              sys.exit(1)
          print("Nenhum achado novo -- so os ja triados (se algum) apareceram.")
          PY

      - name: Publica JSON bruto (para triagem futura)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-resultados
          path: semgrep-*.json
          if-no-files-found: ignore
          retention-days: 30

  # ---------------------------------------------------------------------------
  # (b3) Varredura estatica de seguranca -- CodeQL (F14/A2, hardening)
  #
  # Mesmo espirito do job `semgrep` acima (allowlist de achado ja triado,
  # achado novo reprova). Suite explicita (`security-extended`), nunca a
  # padrao do pack (evita filtro silencioso de query).
  # ---------------------------------------------------------------------------
  codeql:
    name: Seguranca · CodeQL
    needs: deteccao
    if: needs.deteccao.outputs.tem_python == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      # O passo `analyze` da CodeQL Action consulta a API de Actions (status
      # do workflow run, usado para telemetria/categorizacao do SARIF) --
      # sem isto, falha com "Resource not accessible by integration" e o job
      # inteiro vira "configuration error" (achado real: primeira execucao
      # manual do CI em 12 dias, ver commit que corrige a colisao de pytest).
      actions: read
    strategy:
      matrix:
        include:
          - linguagem: python
            fonte: apps/api
          - linguagem: javascript-typescript
            fonte: apps/web
    steps:
      - uses: actions/checkout@v4

      - name: Inicializa CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.linguagem }}
          source-root: ${{ matrix.fonte }}
          queries: security-extended
          config-file: .github/codeql/codeql-config.yml

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Analisa
        uses: github/codeql-action/analyze@v3
        with:
          output: codeql-resultados
          upload: false

      - name: Filtra achados triados e reprova em achado novo
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob
          import json
          import sys

          # Achados revisados por A2 (F14) e confirmados falso-positivo, com
          # justificativa completa em `docs/backlog.md` (2026-08-05, entradas
          # "F14 / A2"). (ruleId, caminho-relativo-ao-repo, linha).
          ACHADOS_TRIADOS = {
              ("py/weak-sensitive-data-hashing", "apps/api/app/comum/autenticacao_cliente.py", 131),
              ("py/weak-sensitive-data-hashing", "apps/api/app/identidade/mfa/backup_codes.py", 34),
              ("py/weak-sensitive-data-hashing", "apps/api/app/identidade/tokens/oauth.py", 196),
              ("py/url-redirection", "apps/api/app/routers/sso.py", 181),
          }

          total_novos = 0
          for caminho_sarif in glob.glob("codeql-resultados/*.sarif"):
              dados = json.load(open(caminho_sarif, encoding="utf-8"))
              for run in dados.get("runs", []):
                  for r in run.get("results", []):
                      loc = r["locations"][0]["physicalLocation"]
                      caminho = loc["artifactLocation"]["uri"]
                      linha = loc["region"].get("startLine", 0)
                      chave = (r["ruleId"], caminho, linha)
                      if chave in ACHADOS_TRIADOS:
                          print(f"[triado, ignorado] {chave}")
                          continue
                      total_novos += 1
                      print(f"::error file={caminho},line={linha}::{r['ruleId']}")

          if total_novos:
              print(f"\n{total_novos} achado(s) NOVO(S), fora da allowlist triada.")
              sys.exit(1)
          print("Nenhum achado novo -- so os ja triados (se algum) apareceram.")
          PY

      - name: Publica SARIF bruto (para triagem futura)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codeql-resultados-${{ matrix.linguagem }}
          path: codeql-resultados
          if-no-files-found: ignore
          retention-days: 30

  # ---------------------------------------------------------------------------
  # (c) Lint, tipos e build do web
  # ---------------------------------------------------------------------------
  web:
    name: Web · eslint + tsc + next build
    needs: deteccao
    if: needs.deteccao.outputs.tem_web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: "**/pnpm-lock.yaml"

      # O lockfile pode viver na raiz (workspace pnpm) ou dentro de apps/web.
      # Descobrimos qual e o diretorio de instalacao em vez de assumir.
      - name: Descobre a raiz do workspace pnpm
        id: raiz
        shell: bash
        run: |
          set -euo pipefail
          if [ -f pnpm-workspace.yaml ] || [ -f pnpm-lock.yaml ]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
          else
            echo "dir=apps/web" >> "$GITHUB_OUTPUT"
          fi

      - name: Instala dependencias
        working-directory: ${{ steps.raiz.outputs.dir }}
        run: pnpm install --frozen-lockfile

      - name: Cache do Next.js
        uses: actions/cache@v4
        with:
          path: apps/web/.next/cache
          key: next-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ hashFiles('apps/web/**/*.[jt]s', 'apps/web/**/*.[jt]sx') }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}-

      - name: eslint
        working-directory: apps/web
        run: pnpm lint

      - name: Verificacao de tipos
        working-directory: apps/web
        run: pnpm exec tsc --noEmit

      - name: next build
        working-directory: apps/web
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_API_URL: http://localhost:8000
        run: pnpm build

  # ---------------------------------------------------------------------------
  # (d) Validacao do contrato OpenAPI
  #     Ver a nota do cabecalho sobre a tolerancia a ausencia do arquivo.
  # ---------------------------------------------------------------------------
  openapi:
    name: Contrato · spectral
    needs: deteccao
    if: needs.deteccao.outputs.tem_openapi == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Instala spectral
        run: npm install -g @stoplight/spectral-cli@6.14.2

      - name: Seleciona ruleset
        id: ruleset
        shell: bash
        run: |
          set -euo pipefail
          if [ -f packages/contracts/.spectral.yaml ]; then
            echo "arquivo=packages/contracts/.spectral.yaml" >> "$GITHUB_OUTPUT"
          elif [ -f .spectral.yaml ]; then
            echo "arquivo=.spectral.yaml" >> "$GITHUB_OUTPUT"
          else
            # Fallback: ruleset embutido do spectral para OpenAPI 3.x.
            printf 'extends: ["spectral:oas"]\n' > /tmp/spectral-padrao.yaml
            echo "arquivo=/tmp/spectral-padrao.yaml" >> "$GITHUB_OUTPUT"
            echo "::notice::Usando ruleset padrao spectral:oas (nenhum .spectral.yaml no repositorio)."
          fi

      # Estrito de proposito: --fail-severity=warn. Sem `|| true`,
      # sem `continue-on-error`. Achado do spectral reprova o CI.
      - name: spectral lint
        run: |
          spectral lint packages/contracts/openapi.yaml \
            --ruleset "${{ steps.ruleset.outputs.arquivo }}" \
            --fail-severity=warn \
            --format=pretty

      - name: Valida demais contratos YAML
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import pathlib, sys, yaml
          base = pathlib.Path("packages/contracts")
          erros = 0
          for arq in sorted(base.glob("*.yaml")) + sorted(base.glob("*.yml")):
              try:
                  yaml.safe_load(arq.read_text(encoding="utf-8"))
                  print(f"ok   {arq}")
              except Exception as exc:
                  erros += 1
                  print(f"FALHA {arq}: {exc}", file=sys.stderr)
          sys.exit(1 if erros else 0)
          PY

  # ---------------------------------------------------------------------------
  # (e) Build das imagens Docker (sem push — push e responsabilidade do deploy)
  # ---------------------------------------------------------------------------
  docker:
    name: Docker · build ${{ matrix.servico }}
    needs: deteccao
    if: needs.deteccao.outputs.tem_dockerfile == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        servico: ${{ fromJSON(needs.deteccao.outputs.dockerfiles) }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.servico }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.servico }}/Dockerfile
          push: false
          load: false
          tags: ponto-${{ matrix.servico }}:ci-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.servico }}
          cache-to: type=gha,mode=max,scope=${{ matrix.servico }}

  # ---------------------------------------------------------------------------
  # Validacao dos proprios arquivos de infra (sempre roda: infra/ ja existe)
  # ---------------------------------------------------------------------------
  infra:
    name: Infra · compose + YAML
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Sintaxe YAML de todos os arquivos versionados
        shell: bash
        run: |
          set -euo pipefail
          pip install --quiet pyyaml
          python - <<'PY'
          import pathlib, sys, yaml
          raiz = pathlib.Path(".")
          ignorar = {".git", "node_modules", ".venv", ".next", "dist", "build"}
          erros = 0
          alvos = [p for ext in ("*.yml", "*.yaml") for p in raiz.rglob(ext)
                   if not set(p.parts) & ignorar]
          for arq in sorted(alvos):
              try:
                  list(yaml.safe_load_all(arq.read_text(encoding="utf-8")))
                  print(f"ok    {arq}")
              except Exception as exc:
                  erros += 1
                  print(f"FALHA {arq}: {exc}", file=sys.stderr)
          print(f"\n{len(alvos)} arquivo(s), {erros} falha(s)")
          sys.exit(1 if erros else 0)
          PY

      # docker compose config resolve interpolacao; usamos o .env.example para
      # ter valores. Se uma variavel obrigatoria sumir do exemplo, isso quebra —
      # o que e desejado: o exemplo tem que continuar sendo suficiente.
      - name: docker compose config (producao)
        run: |
          docker compose \
            --env-file infra/.env.example \
            -f infra/docker-compose.yml \
            config --quiet

      - name: docker compose config (dev)
        run: |
          docker compose \
            --env-file infra/.env.example \
            -f infra/docker-compose.yml \
            -f infra/docker-compose.dev.yml \
            config --quiet

      - name: Nenhum segredo versionado
        shell: bash
        run: |
          set -euo pipefail
          proibidos=$(git ls-files \
            | grep -E '(^|/)\.env($|\.)|\.(pem|p12|pfx|key|jks|keystore)$|local\.properties$' \
            | grep -v '\.example$' || true)
          if [ -n "$proibidos" ]; then
            echo "::error::Arquivo com aparencia de segredo versionado:"
            echo "$proibidos"
            exit 1
          fi
          echo "Nenhum segredo versionado."

  # ---------------------------------------------------------------------------
  # Gate agregador — este e o unico check a marcar como obrigatorio na branch
  # protection. Jobs pulados (arvore ainda inexistente) nao reprovam; jobs que
  # rodaram e falharam reprovam.
  # ---------------------------------------------------------------------------
  ci-ok:
    name: CI OK
    if: always()
    needs:
      [
        deteccao,
        lint-python,
        test-python,
        contrato-schemathesis,
        semgrep,
        codeql,
        web,
        openapi,
        docker,
        infra,
      ]
    runs-on: ubuntu-latest
    steps:
      - name: Consolida resultado
        shell: bash
        run: |
          set -euo pipefail
          resultados='${{ toJSON(needs) }}'
          echo "$resultados"
          if echo "$resultados" | grep -q '"result": *"failure"'; then
            echo "::error::Ao menos um job do CI falhou."
            exit 1
          fi
          if echo "$resultados" | grep -q '"result": *"cancelled"'; then
            echo "::error::Ao menos um job do CI foi cancelado."
            exit 1
          fi
          echo "CI verde."

  # ---------------------------------------------------------------------------
  # (f) Deploy continuo em hml — so em push real a main, so depois do CI
  # inteiro passar. Publica cada imagem em ghcr.io (GITHUB_TOKEN nativo, sem
  # segredo extra) e dispara o redeploy na VPS por uma chave SSH DEDICADA e
  # restrita (forced-command em authorized_keys, so executa infra/
  # deploy-hml.sh -- mesmo se vazar, o estrago maximo e "alguem forca um
  # redeploy do hml", nunca acesso de shell). Alvo e SO hml (homologacao);
  # producao (dominio/segredos reais) e decisao separada, ainda nao tomada.
  # ---------------------------------------------------------------------------
  deploy-hml:
    name: Deploy · hml
    needs: [ci-ok]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        servico: [api, worker, web, device-gw, facial-svc]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e publica ${{ matrix.servico }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.servico }}/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/ponto-${{ matrix.servico }}:latest
          cache-from: type=gha,scope=${{ matrix.servico }}
          cache-to: type=gha,mode=max,scope=${{ matrix.servico }}

  deploy-hml-aplicar:
    name: Deploy · hml (aplicar)
    needs: [deploy-hml]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Dispara infra/deploy-hml.sh na VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PONTO_DEPLOY_HOST }}
          username: root
          key: ${{ secrets.PONTO_DEPLOY_SSH_KEY }}
          # O comando aqui e IGNORADO pelo servidor -- o forced-command do
          # authorized_keys sempre roda infra/deploy-hml.sh, nunca isto.
          script: echo "disparando deploy-hml.sh (forced-command do lado do servidor)"
